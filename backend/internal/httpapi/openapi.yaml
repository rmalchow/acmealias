openapi: 3.1.0
info:
  title: AcmeAlias management API
  version: "1"
  description: |
    The public management API. One contract with two kinds of caller: the console, and customer
    programs. The console is not privileged — it is simply the first client, and its use of this
    API is what demonstrates the API is usable.

    Every account-scoped resource lives under /accounts/{accountId}/. The account is named in the
    path even though an authenticated session already knows which one it selected: if the target
    came only from the session, a forged or confused-deputy request would act in whatever account
    happened to be selected, and the caller would never have had to know which. The service
    refuses a mismatch.

    Collection reads are filtered, paged and counted by the service. The total in X-Total-Count is
    the number of rows the caller MAY SEE that match the filter — not the number in the table —
    because a total counting invisible rows would leak their existence through a number.

    ## Publishing challenge values

    This document describes the management API only. Publishing a challenge value happens on a
    separate, unversioned surface, because it is spoken by ACME clients rather than by programs
    written against this contract, and those clients decide the spelling:

      POST /present, POST /cleanup   lego's httpreq protocol, also served under /acme/httpreq
      POST /update                   the acme-dns protocol

    Both authenticate with the same API keys as this API. `/update` takes
    `{"subdomain": "<alias label>", "txt": "<value>"}` with `X-Api-User` and `X-Api-Key`, and
    answers `{"txt": "<value>"}`; it publishes exactly what `/present` publishes, subject to
    exactly the same grants.

    `POST /register`, which acme-dns defines as an unauthenticated call that creates an account
    and a subdomain, is deliberately NOT implemented — it exists only to refuse and to say where
    credentials come from. Clients never need it: registration in acme-dns is a one-time bootstrap
    whose output is a credentials file, renewal only ever calls `/update`, and that file is
    produced by POST /accounts/{accountId}/domains/{id}/acme-dns below.

    acme-dns has no withdrawal operation, so a value published through `/update` is removed when
    its lifetime expires rather than on a signal from the client.

servers:
  - url: /api/v1

security:
  - session: []
  - apiKey: []

components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: acmeservice_session
      description: |
        A server-side session established through the identity provider. State-changing requests
        additionally carry the cross-site request forgery token as an X-XSRF-TOKEN header.
    apiKey:
      type: http
      scheme: basic
      description: |
        An API key, as basic auth: the key identifier as the username and the secret as the
        password. A key is a subject anchored to one account, and reaches only what its grants
        permit — it never needs to select an account, because its anchor already fixes one.

  parameters:
    accountId:
      name: accountId
      in: path
      required: true
      schema: { type: string, format: uuid }
      description: The account this request acts in. Must be the one the session has selected.
    id:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }

  schemas:
    Error:
      type: object
      properties:
        message: { type: string }
        code:
          type: string
          description: |
            Present where a caller can act on the distinction — no_account_selected and
            account_creation_closed are the two today.
    PermittedActions:
      type: array
      items: { type: string }
      description: |
        What THIS caller may do to THIS object. It accompanies every object rather than costing a
        request per row, and it is not the enforcement point: every request is checked again when
        it arrives, so a stale value costs a refusal rather than access.
    Account:
      type: object
      description: |
        An account is `personal` or `team`, fixed at creation, and neither becomes the other.
        A personal account is materialized for every user at their first sign-in: it is free, has
        no balance, holds no roles or members, and is limited by a project quota. A team account is
        created by funding it, has no project quota, and works only while `credits` is above zero.
      properties:
        id: { type: string, format: uuid }
        slug: { type: string }
        name: { type: string }
        createdAt: { type: string, format: date-time }
        selected: { type: boolean }
        kind: { type: string, enum: [personal, team] }
        owner:
          type: boolean
          description: Whether the caller is the person this account answers to.
        credits:
          type: integer
          format: int64
          description: The balance, in EUR. Always 0 for a personal account, which has no balance.
        suspended:
          type: boolean
          description: |
            Whether the account is unusable. A suspended account is still listed, because its owner
            is the only person who can restore it.
        suspendedReason: { type: string }
    CheckoutAmounts:
      type: object
      description: The amounts a checkout may ask for. An amount outside this set is refused.
      properties:
        amounts: { type: array, items: { type: integer, format: int64 } }
        currency: { type: string }
    Project:
      type: object
      description: |
        A project holds the nodes, domains, aliases and keys that belong together. There is no
        level below it and no level between it and the account: what used to be a load balancer
        inside a project IS the project.
      properties:
        id: { type: string, format: uuid }
        slug: { type: string }
        name: { type: string }
        createdAt: { type: string, format: date-time }
        permittedActions: { $ref: "#/components/schemas/PermittedActions" }
        nodes:
          type: array
          items: { $ref: "#/components/schemas/Node" }
          description: Present on the single-project read; empty in a listing.
        domains:
          type: array
          items: { $ref: "#/components/schemas/Domain" }
          description: Present on the single-project read; absent from a listing.
        nodeCount:
          type: integer
          description: |
            How many nodes the project holds. Present in a LISTING and absent from the
            single-project read, which carries the nodes themselves. Absent is not zero.
        domainCount:
          type: integer
          description: How many domains the project holds. Same rule as nodeCount.
    Node:
      type: object
      properties:
        id: { type: string, format: uuid }
        projectId: { type: string, format: uuid }
        label: { type: string }
        ipv4: { type: string, nullable: true }
        ipv6: { type: string, nullable: true }
    Domain:
      type: object
      properties:
        id: { type: string, format: uuid }
        projectId: { type: string, format: uuid }
        name: { type: string }
        challengeName: { type: string }
        aliasId: { type: string, format: uuid }
        aliasLabel: { type: string }
        createdAt: { type: string, format: date-time }
        lastCheckedAt:
          type: string
          format: date-time
          nullable: true
          description: When a check last looked. Null means we have not looked yet.
        lastSuccessAt:
          type: string
          format: date-time
          nullable: true
          description: |
            When a check last SAW the delegation. Null means never, and a domain that has never
            been seen cannot have challenge values published for it. There is deliberately no
            `active` flag beside these: it would be a third representation of one fact.
    Grant:
      type: object
      description: |
        [object type, identifier, action] plus a flag saying whether it reaches objects contained
        by the one it names. Each part may be a wildcard; the identifier may instead name exactly
        one object. Every grant is anchored to one account, and a wildcard means "within this
        account", never "everywhere".
      properties:
        type: { type: string }
        objectId: { type: string, format: uuid, nullable: true }
        action: { type: string }
        inheritable: { type: boolean }
        summary: { type: string }
    Role:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string }
        unrestricted:
          type: boolean
          description: |
            The account's fixed role: every action on every object of that account. Uneditable,
            undeletable, and never without a member — it is the way back into an account.
        grants: { type: array, items: { $ref: "#/components/schemas/Grant" } }
    Member:
      type: object
      properties:
        id: { type: string, format: uuid }
        userId: { type: string, format: uuid }
        subject: { type: string }
        displayName: { type: string }
        # ABSENT for a member who holds no role — somebody who accepted an
        # invitation and is waiting for one to be assigned. That is a legal
        # state, not a broken row: they are in the account and authorised for
        # nothing in it. A client must treat a missing roleId as "no authority"
        # rather than as an error.
        roleId: { type: string, format: uuid }
        roleName: { type: string }
        # True for the person the account is billed to. They are always a member
        # of the unrestricted role and cannot be removed from it — the account
        # has to be transferred first — so a client offering a "remove" control
        # should not offer it on this row.
        owner: { type: boolean }
    Invitation:
      type: object
      description: |
        An outstanding offer of membership, addressed to an email address.

        It names NO ROLE. Accepting makes the invited person a member holding none, and an
        administrator assigns one afterwards — so joining and being allowed to do things are two
        steps, decided at the two different moments somebody can decide them.

        Nothing here can be used to accept the invitation: the token exists only in the message
        that was sent, and only a hash of it is stored.
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        invitedBy: { type: string }
        createdAt: { type: string, format: date-time }
        lastSentAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
    InvitationOffer:
      type: object
      description: |
        What an invited person is shown before answering: which account, and the address the
        invitation was sent to. Nothing else about the account is disclosed, and no role, because
        the invitation offers none.
      properties:
        # Present only on GET /invitations — your own list — and absent from a token resolution.
        # It is not a credential: answering by identifier finds the row only when the invited
        # address is the caller's own verified one, so somebody else's identifier is
        # indistinguishable from one belonging to no invitation.
        id: { type: string, format: uuid }
        account: { type: string }
        accountId: { type: string, format: uuid }
        email: { type: string, format: email }
        expiresAt: { type: string, format: date-time }
    ApiKey:
      type: object
      description: |
        A key is of one of two kinds, and the kind says what its authority is and what it dies
        with. A PROJECT key is bound to one project, answers that project's challenges, and is
        deleted when the project is. A SYSTEM key holds a role, does whatever that role permits,
        and outlives every project in the account.

        Neither kind is authorized differently from anybody else: both resolve to grants before
        anything is decided, which is why a project key lists no grants of its own.
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [project, system] }
        projectId:
          type: string
          format: uuid
          description: The project a project key is bound to and dies with. Absent on a system key.
        roleId:
          type: string
          format: uuid
          description: |
            The role a system key holds. Absent on a project key, and absent on a system key that
            predates the two kinds and carries its own grants instead.
        roleName: { type: string }
        restrictToNodes:
          type: boolean
          description: |
            Whether this project key accepts requests only from the addresses configured on its
            project's nodes. A switch, not a copied list: what it permits is whatever the project's
            nodes are when a request arrives. A project with no nodes then permits nothing.
        lastRefusedIp:
          type: string
          nullable: true
          description: |
            The source address of the most recent refusal for an address restriction, and the
            address the service actually SAW rather than the one configured on a node. It is here
            because the refusal itself is deliberately indistinguishable from a wrong secret, and
            behind NAT or an egress gateway the two differ.
        lastRefusedAt: { type: string, format: date-time, nullable: true }
        identifier: { type: string }
        displayPrefix: { type: string }
        note: { type: string }
        networks: { type: array, items: { type: string } }
        grants: { type: array, items: { $ref: "#/components/schemas/Grant" } }
        createdAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time, nullable: true }
        lastUsedAt: { type: string, format: date-time, nullable: true }
        disabledAt: { type: string, format: date-time, nullable: true }
        active: { type: boolean }

    AcmeDnsIssued:
      type: object
      description: |
        The credentials file, the key it belongs to, and the record the customer publishes.

        The four field names inside `credentials` are acme-dns's and are not ours to tidy:
        cert-manager unmarshals a Kubernetes Secret into exactly them, and so do acme.sh, win-acme
        and the rest. `username` and `password` are the key's identifier and secret, sent as
        `X-Api-User` and `X-Api-Key`; `fulldomain` is the name the customer's CNAME points at; and
        `subdomain` is its first label, which is what `POST /update` names in its body.

        acme-dns's own file also carries `allowfrom`. It is omitted: clients ignore it, and this
        service's equivalent is the key's own address restrictions, which are shown on the key.
      properties:
        credentials:
          type: object
          properties:
            username: { type: string }
            password: { type: string }
            fulldomain: { type: string }
            subdomain: { type: string }
        domain:
          type: string
          description: |
            The domain these credentials are for. It is here because there is no single acme-dns
            credentials FILE format: lego, Traefik, cert-manager and certbot's plugin read a JSON
            object keyed by domain; win-acme and Certify The Web read a flat object in a file named
            for the domain; Posh-ACME reads a positional four-element array keyed by
            `_acme-challenge.<domain>`. The four fields above are the same in every one of them,
            so a client of this API composes the wrapper its target expects.
        key: { $ref: "#/components/schemas/ApiKey" }
        notice: { type: string }
        cname:
          type: string
          description: The record the customer publishes, in zone-file form.

  responses:
    NoAccountSelected:
      description: |
        The session has selected no account. Distinct from an empty result, which would read as
        "you have nothing" — a different and wrong answer.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: |
        No such object, OR one this caller may not see. The two are deliberately indistinguishable:
        the query that answered cannot tell them apart either.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

paths:
  /me:
    get:
      summary: The signed-in person, and which account they are acting in
      description: |
        `roles` and `permissions` describe what the caller may do IN THE SELECTED ACCOUNT, and are
        empty when no account is selected — which is the state every session starts in.
      responses:
        "200": { description: OK }

  /accounts:
    get:
      summary: The accounts this person belongs to
      description: Reachable with no account selected.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Account" } }
    post:
      summary: Buy a team account
      description: |
        Creating a team account and funding it are one act, in one transaction: no team account
        exists that has never been funded. The body carries `slug`, `name` and an `amount` from
        the offered set; an amount outside it is refused.

        Refused unless the deployment enables it. A deployment authenticating a whole organization
        does not want every person in it able to create a tenant.

        There is no route that creates a PERSONAL account. Every user has one because they are a
        user; it appears at their first sign-in.
      responses:
        "201": { description: Created and funded }
        "400": { description: The amount is not one this service offers }
        "403": { description: Account creation is not enabled here }

  /checkout/amounts:
    get:
      summary: The amounts a checkout may ask for
      description: Reachable with no account selected; it is what the buy screen renders.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CheckoutAmounts" }

  /accounts/{accountId}/checkout:
    post:
      summary: Add credit to an account
      description: |
        Deliberately NOT an account-scoped route. Every route under the scoped group is refused
        for a suspended account, and the person this exists for is the owner of exactly such an
        account — gating it on the account working would mean nobody could ever pay for one.

        What gates it instead is ownership: only the person the account answers to may add credit.
        The amount comes from the offered set.

        Because the account is named in the path and there is no selection to check it against,
        a caller who does not own it is answered NOT FOUND rather than forbidden — the same
        answer as for an account that does not exist, so the route cannot be used to confirm
        that a guessed identifier names a real account.
      parameters: [{ $ref: "#/components/parameters/accountId" }]
      responses:
        "200":
          description: The new balance
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Account" }
        "400": { description: The amount is not one this service offers }
        "404": { description: No such account, or it is not yours; the two are indistinguishable }

  /accounts/{accountId}/select:
    post:
      summary: Switch the session into one account
      description: |
        Membership is re-evaluated here, so a revoked membership takes effect at the switch.

        A suspended team account cannot be selected by a member — but it CAN be selected by its
        owner, who then reaches its balance and checkout and nothing else. Without that exception
        a suspended account would be unreachable by the only person who can restore it.
      parameters: [{ $ref: "#/components/parameters/accountId" }]
      responses:
        "204": { description: Selected }
        "402": { description: The account is suspended and the caller is not its owner }
        "404": { $ref: "#/components/responses/NotFound" }

  /accounts/{accountId}/projects:
    parameters: [{ $ref: "#/components/parameters/accountId" }]
    get:
      summary: Projects this caller may see
      parameters:
        - { name: q, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer } }
        - { name: offset, in: query, schema: { type: integer } }
      responses:
        "200":
          description: OK
          headers:
            X-Total-Count:
              schema: { type: integer }
              description: Rows matching the filter that this caller may see.
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Project" } }
        "409": { $ref: "#/components/responses/NoAccountSelected" }
    post:
      summary: Create a project
      description: |
        Governed by membership of the account's unrestricted role, not by a grant.

        A personal account holds a configured number of projects — five by default. A team
        account has no project quota at all; its balance is what limits it. Exceeding the quota is
        a 409 and not a 403: it is a lack of room, not a lack of authority, and the remedy is to
        delete a project or move to a team account rather than to ask somebody for a grant.
      responses:
        "201": { description: Created }
        "409": { description: The account is full, or no account is selected }

  /accounts/{accountId}/projects/{id}:
    parameters:
      - { $ref: "#/components/parameters/accountId" }
      - { $ref: "#/components/parameters/id" }
    get:
      summary: One project
      responses:
        "200": { description: OK }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      summary: Rename a project
      responses:
        "200": { description: OK }
    delete:
      summary: Delete an empty project
      responses:
        "200": { description: Deleted }
        "409": { description: The project still has domains or aliases }

  /accounts/{accountId}/projects/{id}/usage:
    parameters:
      - { $ref: "#/components/parameters/accountId" }
      - { $ref: "#/components/parameters/id" }
    get:
      summary: Challenge and issuance activity over time
      responses:
        "200": { description: OK }

  /accounts/{accountId}/projects/{id}/inventory-history:
    parameters:
      - { $ref: "#/components/parameters/accountId" }
      - { $ref: "#/components/parameters/id" }
    get:
      summary: Inventory size over time
      responses:
        "200": { description: OK }

  /accounts/{accountId}/projects/{id}/nodes:
    parameters:
      - { $ref: "#/components/parameters/accountId" }
      - { $ref: "#/components/parameters/id" }
    post:
      summary: Add a node
      responses:
        "201": { description: Created }

  /accounts/{accountId}/nodes/{id}:
    parameters:
      - { $ref: "#/components/parameters/accountId" }
      - { $ref: "#/components/parameters/id" }
    patch:
      summary: Replace a node's addresses
      responses:
        "200": { description: OK }
    delete:
      summary: Remove a node
      responses:
        "200": { description: Deleted }

  /accounts/{accountId}/projects/{id}/domains:
    parameters:
      - { $ref: "#/components/parameters/accountId" }
      - { $ref: "#/components/parameters/id" }
    get:
      summary: A project's domains
      responses:
        "200": { description: OK }
    post:
      summary: Add a domain, creating or reusing its challenge alias
      responses:
        "201": { description: Created }
        "409": { description: The challenge name belongs to another project }

  /accounts/{accountId}/domains/{id}:
    parameters:
      - { $ref: "#/components/parameters/accountId" }
      - { $ref: "#/components/parameters/id" }
    patch:
      summary: Turn certificate observation on or off for this domain
      description: >
        `observeTls` is the switch; `tlsTestHost` is the name a wildcard is
        observed under, since `*.example.com` is not a name a TLS client asks
        for. Omitting `tlsTestHost` leaves the stored one alone, so turning the
        switch off and on again does not ask for it a second time.
      responses:
        "200": { description: OK }
        "400": { description: A wildcard with no test hostname, or one it does not cover }
    delete:
      summary: Remove a domain, and its alias if nothing else uses it
      responses:
        "200": { description: Deleted }

  /accounts/{accountId}/domains/{id}/certificate:
    parameters:
      - { $ref: "#/components/parameters/accountId" }
      - { $ref: "#/components/parameters/id" }
    get:
      summary: What this domain's addresses last presented
      description: >
        The most recent observation per node address, and the worst of their
        bands as the domain's own. A read of what the observer already recorded
        — it dials nothing.
      responses:
        "200": { description: OK }

  /accounts/{accountId}/domains/{id}/certificate/history:
    parameters:
      - { $ref: "#/components/parameters/accountId" }
      - { $ref: "#/components/parameters/id" }
    get:
      summary: Every observation of this domain, newest first
      responses:
        "200": { description: OK }
        "418":
          description: >
            Not available on a personal account. This is the one response in this
            document with a description rather than "OK", and it is here because
            no generator infers a teapot and every one of them omits it silently.
            The history is part of a team account; a personal account is served
            the current state and not the history. It is deliberately NOT 403,
            402 or 409: nothing is wrong with the caller's authority, nothing is
            unpaid, and the account is not the wrong SHAPE for the request — the
            feature is withheld commercially, which is what the `message` body
            says. Read the message, not the number.
  /accounts/{accountId}/domains/{id}/acme-dns:
    parameters:
      - { $ref: "#/components/parameters/accountId" }
      - { $ref: "#/components/parameters/id" }
    post:
      summary: Issue acme-dns credentials for this domain
      description: |
        Creates a project key and answers with the credentials file acme-dns clients read. This is
        what replaces acme-dns's unauthenticated `POST /register`: the same four fields, produced
        deliberately by somebody who is already authorized, rather than minted on demand by anyone
        who can reach the service.

        The secret is in this response and nowhere else, ever. Calling this twice produces two
        keys, which is correct — each is revocable on its own, and rotating a client's credentials
        is issuing a second file and then revoking the first.

        `restrictToNodes` limits the key to the addresses configured on the domain's project's
        nodes, resolved when a request arrives.
      responses:
        "201":
          description: Created — the secret is in this response and nowhere else, ever
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AcmeDnsIssued" }

  /accounts/{accountId}/projects/{id}/keys:
    parameters:
      - { $ref: "#/components/parameters/accountId" }
      - { $ref: "#/components/parameters/id" }
    get:
      summary: This project's keys
      description: |
        Project keys only. A system key that happens to reach this project through its role is not
        listed here: it belongs to the account and outlives every project in it, and showing the two
        together is how somebody discovers that deleting a project revoked their automation.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/ApiKey" } }
    post:
      summary: Create a project key
      description: |
        The key is bound to this project by a foreign key and is deleted with it. Its authority is
        that project's challenge answering and nothing else; it holds no grants of its own.

        Refused unless that authority is covered by a single grant the creator holds. Coverage is
        not assembled from several held grants: the union is true only of today's inventory.

        `restrictToNodes` limits the key to the addresses configured on this project's nodes. It is
        a switch, not a copied list: what it permits is whatever the project's nodes are when a
        request arrives, so adding a node needs no change to the key. A project with no nodes
        permits nothing.
      responses:
        "201": { description: Created — the secret is in this response and nowhere else, ever }

  /accounts/{accountId}/keys:
    parameters:
      - { $ref: "#/components/parameters/accountId" }
    get:
      summary: The account's system keys
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/ApiKey" } }
    post:
      summary: Create a system key
      description: |
        A system key holds a role, and is otherwise a member of the account that happens not to be a
        person. It outlives every project. `roleId` is required and names a role of this account.

        Team accounts only. A personal account has no roles and no roster, so there is nothing for
        such a key to hold — the refusal reports that one cannot exist there rather than that the
        caller may not create one.
      responses:
        "201": { description: Created — the secret is in this response and nowhere else, ever }
        "409": { description: This is a personal account, which has no roles }

  /accounts/{accountId}/keys/{id}/networks:
    parameters:
      - { $ref: "#/components/parameters/accountId" }
      - { $ref: "#/components/parameters/id" }
    put:
      summary: Replace a key's address restrictions
      responses:
        "200": { description: OK }

  /accounts/{accountId}/keys/{id}/expiry:
    parameters:
      - { $ref: "#/components/parameters/accountId" }
      - { $ref: "#/components/parameters/id" }
    put:
      summary: Set or clear a key's expiry
      responses:
        "200": { description: OK }

  /accounts/{accountId}/keys/{id}/rotate:
    parameters:
      - { $ref: "#/components/parameters/accountId" }
      - { $ref: "#/components/parameters/id" }
    post:
      summary: Replace a key's secret, keeping its authority exactly
      responses:
        "201": { description: Created }

  /accounts/{accountId}/keys/{id}:
    parameters:
      - { $ref: "#/components/parameters/accountId" }
      - { $ref: "#/components/parameters/id" }
    delete:
      summary: Revoke a key without deleting its history
      responses:
        "200": { description: Revoked }

  /accounts/{accountId}/projects/{id}/verification:
    parameters:
      - { $ref: "#/components/parameters/accountId" }
      - { $ref: "#/components/parameters/id" }
    get:
      summary: What each domain's records actually resolve to right now
      description: >
        Answers per domain. Which records a domain needs is a property of the
        domain — `cnameTarget` and `expectedCaa` on the domain read — so this
        answers only what DNS says about them. With no verification resolver
        configured it still answers 200, with every domain reading
        "not-checked": a deployment that declined the feature is not broken.
      responses:
        "200": { description: OK }
    post:
      summary: The same check, run on request, and recorded
      description: >
        Identical body to the GET. The difference is that what it saw is stored:
        a delegation observed here activates its domains immediately, which is
        the "check now" for somebody who has just published the record and does
        not want to wait for the poller. It never deactivates — a check that
        fails to see a delegation records only that we looked.
      responses:
        "200": { description: OK }

  /accounts/{accountId}/projects/{id}/interactions:
    parameters:
      - { $ref: "#/components/parameters/accountId" }
      - { $ref: "#/components/parameters/id" }
    get:
      summary: Publications seen through to their end
      responses:
        "200": { description: OK }

  # All three require inventory.view in the account, like every other read of
  # what it holds. Membership alone is not enough: a member holding a role with
  # no grants is refused these exactly as they are refused the project listing.
  /accounts/{accountId}/challenges:
    parameters: [{ $ref: "#/components/parameters/accountId" }]
    get:
      summary: Values answerable right now
      responses:
        "200": { description: OK }
        "403": { description: The caller does not hold inventory.view in this account }

  /accounts/{accountId}/audit:
    parameters: [{ $ref: "#/components/parameters/accountId" }]
    get:
      summary: What changed in this account, and who changed it
      responses:
        "200": { description: OK }
        "403": { description: The caller does not hold inventory.view in this account }

  /accounts/{accountId}/config:
    parameters: [{ $ref: "#/components/parameters/accountId" }]
    get:
      summary: The effective configuration, redacted
      responses:
        "200": { description: OK }
        "403": { description: The caller does not hold inventory.view in this account }

  # Roles and members exist only in a TEAM account. In a personal account these routes are
  # REFUSED with 409 rather than answered with an empty collection, so a client can tell "there
  # are none" from "there cannot be any". API keys and their grants are not like this: the grant
  # model, and its subset rule, stay live in every account.
  /accounts/{accountId}/roles:
    parameters: [{ $ref: "#/components/parameters/accountId" }]
    get:
      summary: The roles this account defines
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Role" } }
    post:
      summary: Create a role
      responses:
        "201": { description: Created }
        "403": { description: A grant was not covered by one the writer holds }

  /accounts/{accountId}/roles/{id}:
    parameters:
      - { $ref: "#/components/parameters/accountId" }
      - { $ref: "#/components/parameters/id" }
    put:
      summary: Replace a role's name, description and grants
      responses:
        "200": { description: OK }
        "409": { description: The unrestricted role cannot be changed }
    delete:
      summary: Delete a role that has no members
      responses:
        "204": { description: Deleted }

  /accounts/{accountId}/members:
    parameters: [{ $ref: "#/components/parameters/accountId" }]
    get:
      summary: Who is in this account
      description: Readable by any member without a grant.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Member" } }
    post:
      summary: Add a member
      responses:
        "204": { description: Added }

  /accounts/{accountId}/members/{id}:
    parameters:
      - { $ref: "#/components/parameters/accountId" }
      - { $ref: "#/components/parameters/id" }
    delete:
      summary: Remove a member
      responses:
        "204": { description: Removed }
        "409": { description: This would leave the unrestricted role with no member }

  /accounts/{accountId}/members/{id}/role:
    parameters:
      - { $ref: "#/components/parameters/accountId" }
      - { $ref: "#/components/parameters/id" }
    put:
      summary: Give a role to a member who holds none
      description: |
        Completes what accepting an invitation began. An invitation names no role, so somebody who
        accepted one is a member of the account and authorised for nothing in it until this is
        called.

        It is not a way to change an existing member's role: a membership that already holds one is
        refused. Re-pointing somebody at a different role is a removal and an addition, which is
        two audit entries because it is two decisions.

        Requires membership of the account's unrestricted role.
      responses:
        "204": { description: Assigned }
        "403": { description: The caller is not in the account's unrestricted role }
        "409": { description: No membership is waiting for a role }

  /accounts/{accountId}/invitations:
    parameters: [{ $ref: "#/components/parameters/accountId" }]
    get:
      summary: Who has been invited and has not answered
      description: |
        Readable by any member without a grant, for the same reason the member list is: a pending
        invitation nobody can see is how an account acquires a member nobody remembers inviting.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Invitation" } }
    post:
      summary: Invite somebody by email address
      description: |
        Requires membership of the account's unrestricted role — the account's owner and its
        administrators.

        The response is IDENTICAL whether or not the address already has a user here. That is a
        property rather than an accident: a difference would make this endpoint an oracle telling
        any account administrator whether a given address has an account with us.

        The invitation expires in fourteen days and names no role. It is refused if the address
        already holds a membership of this account, or already has an outstanding invitation to it —
        re-send that one instead.

        Rate limited three ways: per account per hour, per invited address per day across ALL
        accounts, and per re-send. The middle one is the one that matters, because anybody may
        create accounts freely and a per-account limit is therefore defeated by creating accounts.
      responses:
        "201":
          description: Issued, and a message has been sent
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Invitation" }
        "403": { description: The caller is not in the account's unrestricted role }
        "409": { description: Already a member, or already invited }
        "429":
          description: A rate limit was reached. Retry-After says when.

  /accounts/{accountId}/invitations/{id}:
    parameters:
      - { $ref: "#/components/parameters/accountId" }
      - { $ref: "#/components/parameters/id" }
    delete:
      summary: Revoke an invitation
      description: |
        The token stops resolving immediately. The row is kept as a record of what was offered to
        whom, and no message is sent — telling somebody an offer they may never have seen has been
        withdrawn is noise at best.
      responses:
        "204": { description: Revoked }
        "403": { description: The caller is not in the account's unrestricted role }

  /accounts/{accountId}/invitations/{id}/resend:
    parameters:
      - { $ref: "#/components/parameters/accountId" }
      - { $ref: "#/components/parameters/id" }
    post:
      summary: Send the invitation again
      description: |
        Issues a NEW token and invalidates the previous one, and restarts the fourteen days.

        Invalidating the old one is the point rather than tidiness: re-sending is what an
        administrator does when told "I never got it", and the message that was never got is
        exactly the one that might have gone somewhere unintended.
      responses:
        "200":
          description: Sent
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Invitation" }
        "403": { description: The caller is not in the account's unrestricted role }
        "429": { description: Re-sent too recently. Retry-After says when. }

  /invitations:
    get:
      summary: The invitations issued to your own address
      description: |
        Across every account, needing no token and no selected account.

        This is the second way into an invitation and it is not a fallback. A flow that depends on
        a link depends on mail delivery being perfect, and it is not: the message lands in spam, a
        corporate gateway rewrites the URL and breaks it, somebody reads it on a phone and signs in
        on a laptop.

        It grants nothing the token grants. Both routes require authenticating as the invited
        address, and being signed in as that address is strictly stronger evidence than holding a
        link sent to it.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/InvitationOffer" } }

  /invitations/resolve:
    post:
      summary: Read the offer a token addresses
      description: |
        Consumes NOTHING, which is why it can be called repeatedly. Links in mail are opened by
        things that are not people — security gateways follow every URL to scan them, clients
        generate previews — and if arrival consumed the token a meaningful share of invitations
        would be dead before their invitee ever saw them.

        A POST despite reading nothing, because the token travels in the request BODY. A token in a
        URL lands in access logs, in browser history and in the Referer header of every subsequent
        request.

        Reachable with NO account selected: the invitee is not a member of anything yet, which is
        the entire point of an invitation.

        Every reason a token cannot be used — unknown, expired, revoked, declined, already accepted
        — answers the same 404 with the same sentence. Distinguishing them would answer "was this
        token ever real", which is the one question its unguessability exists to make unanswerable.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties: { token: { type: string } }
      responses:
        "200":
          description: The offer
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InvitationOffer" }
        "404": { description: This invitation is no longer valid }

  /invitations/accept:
    post:
      summary: Accept an invitation
      description: |
        Creates the membership, consumes the token, and makes the joined account this session's
        selection — leaving somebody in the empty state immediately after they joined something is
        a dead end.

        The membership holds NO ROLE. The new member is in the account and authorised for nothing
        in it until an administrator assigns one.

        ONLY a user whose verified address is the invited address may accept. A forwarded link
        confers nothing, and there is deliberately no operation anywhere in this API that attaches
        the invited address to whoever is signed in — holding a link sent to an address IS proof of
        control of it, so such an operation would turn every bound invitation into a bearer one.

        A refusal names the invited address only in masked form.
      requestBody:
        required: true
        description: |
          Name the invitation by `token` (from the message) or by `id` (from GET /invitations).
          Both are governed by the same rule: the caller must be authenticated as the invited
          address. The identifier path additionally will not find a row unless that is already
          true, so it discloses nothing about invitations belonging to anybody else.
        content:
          application/json:
            schema:
              type: object
              properties:
                token: { type: string }
                id: { type: string, format: uuid }
      responses:
        "200":
          description: Joined
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InvitationOffer" }
        "403": { description: This invitation was sent to a different address }
        "404": { description: This invitation is no longer valid }
        "409": { description: Already a member of that account }

  /invitations/decline:
    post:
      summary: Decline an invitation
      description: |
        Consumes the invitation exactly as accepting does, so a later stray click cannot undo it and
        land somebody in an account they refused.

        It exists because ignoring an invitation already expires it, and the two look identical to
        the account while meaning opposite things: never saw it — re-send, or telephone — versus saw
        it and said no, which makes re-sending a nuisance aimed at somebody who already answered.

        It is NOT a block. The account may invite the same address again, because "not now" and
        "never" are different answers and nothing here can tell which was meant.
      requestBody:
        required: true
        description: |
          Name the invitation by `token` or by `id`, exactly as accepting does.
        content:
          application/json:
            schema:
              type: object
              properties:
                token: { type: string }
                id: { type: string, format: uuid }
      responses:
        "204": { description: Declined }
        "403": { description: This invitation was sent to a different address }
        "404": { description: This invitation is no longer valid }

  /accounts/{accountId}/transfer:
    post:
      summary: Hand a team account to another user
      description: |
        The recipient is named by identity-provider subject, and is given an unrestricted
        membership in the same transaction — an owner who is not a member cannot open their own
        account. Only the current owner may do it.

        A personal account is never transferred: it is one person's own workspace, and handing it
        over would make it a team account with the team parts missing.
      parameters: [{ $ref: "#/components/parameters/accountId" }]
      responses:
        "204": { description: Transferred }
        "403": { description: The caller is not the account's owner }
        "409": { description: This account cannot be transferred }

  /sessions:
    get:
      summary: Your own console sessions
      description: |
        The sessions of the person making the request, and nobody else's. A session belongs to a
        person rather than to an account, so there is no account-level authority over one.
      responses:
        "200": { description: OK }
    delete:
      summary: Sign out everywhere
      description: |
        Ends every session the caller holds. The optional `subject` query parameter is a check
        rather than a target: naming anybody but yourself is refused.
      parameters:
        - { name: subject, in: query, required: false, schema: { type: string } }
      responses:
        "200": { description: OK }
        "403": { description: The named subject is not the caller }

  /sessions/{handle}:
    parameters:
      - { name: handle, in: path, required: true, schema: { type: string } }
    delete:
      summary: End one of your own sessions
      responses:
        "200": { description: OK }
        "404": { description: You hold no valid session with that handle }
