openapi: 3.1.0
info:
  title: acmeservice management API
  version: "1"
  description: |
    The public management API. One contract with two kinds of caller: the console, and customer
    programs. The console is not privileged — it is simply the first client, and its use of this
    API is what demonstrates the API is usable.

    Every account-scoped resource lives under /accounts/{accountId}/. The account is named in the
    path even though an authenticated session already knows which one it selected: if the target
    came only from the session, a forged or confused-deputy request would act in whatever account
    happened to be selected, and the caller would never have had to know which. The service
    refuses a mismatch.

    Collection reads are filtered, paged and counted by the service. The total in X-Total-Count is
    the number of rows the caller MAY SEE that match the filter — not the number in the table —
    because a total counting invisible rows would leak their existence through a number.

servers:
  - url: /api/v1

security:
  - session: []
  - apiKey: []

components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: acmeservice_session
      description: |
        A server-side session established through the identity provider. State-changing requests
        additionally carry the cross-site request forgery token as an X-XSRF-TOKEN header.
    apiKey:
      type: http
      scheme: basic
      description: |
        An API key, as basic auth: the key identifier as the username and the secret as the
        password. A key is a subject anchored to one account, and reaches only what its grants
        permit — it never needs to select an account, because its anchor already fixes one.

  parameters:
    accountId:
      name: accountId
      in: path
      required: true
      schema: { type: string, format: uuid }
      description: The account this request acts in. Must be the one the session has selected.
    id:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }

  schemas:
    Error:
      type: object
      properties:
        message: { type: string }
        code:
          type: string
          description: |
            Present where a caller can act on the distinction — no_account_selected and
            account_creation_closed are the two today.
    PermittedActions:
      type: array
      items: { type: string }
      description: |
        What THIS caller may do to THIS object. It accompanies every object rather than costing a
        request per row, and it is not the enforcement point: every request is checked again when
        it arrives, so a stale value costs a refusal rather than access.
    Account:
      type: object
      description: |
        An account is `personal` or `team`, fixed at creation, and neither becomes the other.
        A personal account is materialized for every user at their first sign-in: it is free, has
        no balance, holds no roles or members, and is limited by a project quota. A team account is
        created by funding it, has no project quota, and works only while `credits` is above zero.
      properties:
        id: { type: string, format: uuid }
        slug: { type: string }
        name: { type: string }
        createdAt: { type: string, format: date-time }
        selected: { type: boolean }
        kind: { type: string, enum: [personal, team] }
        owner:
          type: boolean
          description: Whether the caller is the person this account answers to.
        credits:
          type: integer
          format: int64
          description: The balance, in EUR. Always 0 for a personal account, which has no balance.
        suspended:
          type: boolean
          description: |
            Whether the account is unusable. A suspended account is still listed, because its owner
            is the only person who can restore it.
        suspendedReason: { type: string }
    CheckoutAmounts:
      type: object
      description: The amounts a checkout may ask for. An amount outside this set is refused.
      properties:
        amounts: { type: array, items: { type: integer, format: int64 } }
        currency: { type: string }
    Project:
      type: object
      properties:
        id: { type: string, format: uuid }
        slug: { type: string }
        name: { type: string }
        createdAt: { type: string, format: date-time }
        permittedActions: { $ref: "#/components/schemas/PermittedActions" }
    LoadBalancer:
      type: object
      properties:
        id: { type: string, format: uuid }
        projectId: { type: string, format: uuid }
        slug: { type: string }
        name: { type: string }
        createdAt: { type: string, format: date-time }
        permittedActions: { $ref: "#/components/schemas/PermittedActions" }
    Grant:
      type: object
      description: |
        [object type, identifier, action] plus a flag saying whether it reaches objects contained
        by the one it names. Each part may be a wildcard; the identifier may instead name exactly
        one object. Every grant is anchored to one account, and a wildcard means "within this
        account", never "everywhere".
      properties:
        type: { type: string }
        objectId: { type: string, format: uuid, nullable: true }
        action: { type: string }
        inheritable: { type: boolean }
        summary: { type: string }
    Role:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string }
        unrestricted:
          type: boolean
          description: |
            The account's fixed role: every action on every object of that account. Uneditable,
            undeletable, and never without a member — it is the way back into an account.
        grants: { type: array, items: { $ref: "#/components/schemas/Grant" } }
    Member:
      type: object
      properties:
        id: { type: string, format: uuid }
        userId: { type: string, format: uuid }
        subject: { type: string }
        displayName: { type: string }
        roleId: { type: string, format: uuid }
        roleName: { type: string }
    ApiKey:
      type: object
      properties:
        id: { type: string, format: uuid }
        identifier: { type: string }
        displayPrefix: { type: string }
        note: { type: string }
        networks: { type: array, items: { type: string } }
        grants: { type: array, items: { $ref: "#/components/schemas/Grant" } }
        createdAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time, nullable: true }
        lastUsedAt: { type: string, format: date-time, nullable: true }
        disabledAt: { type: string, format: date-time, nullable: true }
        active: { type: boolean }

  responses:
    NoAccountSelected:
      description: |
        The session has selected no account. Distinct from an empty result, which would read as
        "you have nothing" — a different and wrong answer.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: |
        No such object, OR one this caller may not see. The two are deliberately indistinguishable:
        the query that answered cannot tell them apart either.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

paths:
  /me:
    get:
      summary: The signed-in person, and which account they are acting in
      description: |
        `roles` and `permissions` describe what the caller may do IN THE SELECTED ACCOUNT, and are
        empty when no account is selected — which is the state every session starts in.
      responses:
        "200": { description: OK }

  /accounts:
    get:
      summary: The accounts this person belongs to
      description: Reachable with no account selected.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Account" } }
    post:
      summary: Buy a team account
      description: |
        Creating a team account and funding it are one act, in one transaction: no team account
        exists that has never been funded. The body carries `slug`, `name` and an `amount` from
        the offered set; an amount outside it is refused.

        Refused unless the deployment enables it. A deployment authenticating a whole organization
        does not want every person in it able to create a tenant.

        There is no route that creates a PERSONAL account. Every user has one because they are a
        user; it appears at their first sign-in.
      responses:
        "201": { description: Created and funded }
        "400": { description: The amount is not one this service offers }
        "403": { description: Account creation is not enabled here }

  /checkout/amounts:
    get:
      summary: The amounts a checkout may ask for
      description: Reachable with no account selected; it is what the buy screen renders.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CheckoutAmounts" }

  /accounts/{accountId}/checkout:
    post:
      summary: Add credit to an account
      description: |
        Deliberately NOT an account-scoped route. Every route under the scoped group is refused
        for a suspended account, and the person this exists for is the owner of exactly such an
        account — gating it on the account working would mean nobody could ever pay for one.

        What gates it instead is ownership: only the person the account answers to may add credit.
        The amount comes from the offered set.

        Because the account is named in the path and there is no selection to check it against,
        a caller who does not own it is answered NOT FOUND rather than forbidden — the same
        answer as for an account that does not exist, so the route cannot be used to confirm
        that a guessed identifier names a real account.
      parameters: [{ $ref: "#/components/parameters/accountId" }]
      responses:
        "200":
          description: The new balance
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Account" }
        "400": { description: The amount is not one this service offers }
        "404": { description: No such account, or it is not yours; the two are indistinguishable }

  /accounts/{accountId}/select:
    post:
      summary: Switch the session into one account
      description: |
        Membership is re-evaluated here, so a revoked membership takes effect at the switch.

        A suspended team account cannot be selected by a member — but it CAN be selected by its
        owner, who then reaches its balance and checkout and nothing else. Without that exception
        a suspended account would be unreachable by the only person who can restore it.
      parameters: [{ $ref: "#/components/parameters/accountId" }]
      responses:
        "204": { description: Selected }
        "402": { description: The account is suspended and the caller is not its owner }
        "404": { $ref: "#/components/responses/NotFound" }

  /accounts/{accountId}/projects:
    parameters: [{ $ref: "#/components/parameters/accountId" }]
    get:
      summary: Projects this caller may see
      parameters:
        - { name: q, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer } }
        - { name: offset, in: query, schema: { type: integer } }
      responses:
        "200":
          description: OK
          headers:
            X-Total-Count:
              schema: { type: integer }
              description: Rows matching the filter that this caller may see.
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Project" } }
        "409": { $ref: "#/components/responses/NoAccountSelected" }
    post:
      summary: Create a project
      description: |
        Governed by membership of the account's unrestricted role, not by a grant.

        A personal account holds a configured number of projects — five by default. A team
        account has no project quota at all; its balance is what limits it. Exceeding the quota is
        a 409 and not a 403: it is a lack of room, not a lack of authority, and the remedy is to
        delete a project or move to a team account rather than to ask somebody for a grant.
      responses:
        "201": { description: Created }
        "409": { description: The account is full, or no account is selected }

  /accounts/{accountId}/projects/{id}:
    parameters:
      - { $ref: "#/components/parameters/accountId" }
      - { $ref: "#/components/parameters/id" }
    get:
      summary: One project
      responses:
        "200": { description: OK }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      summary: Rename a project
      responses:
        "200": { description: OK }
    delete:
      summary: Delete an empty project
      responses:
        "200": { description: Deleted }
        "409": { description: The project still has load balancers }

  /accounts/{accountId}/projects/{id}/loadbalancers:
    parameters:
      - { $ref: "#/components/parameters/accountId" }
      - { $ref: "#/components/parameters/id" }
    get:
      summary: A project's load balancers
      responses:
        "200": { description: OK }
    post:
      summary: Create a load balancer
      responses:
        "201": { description: Created }

  /accounts/{accountId}/projects/{id}/usage:
    parameters:
      - { $ref: "#/components/parameters/accountId" }
      - { $ref: "#/components/parameters/id" }
    get:
      summary: Challenge and issuance activity over time
      responses:
        "200": { description: OK }

  /accounts/{accountId}/projects/{id}/inventory-history:
    parameters:
      - { $ref: "#/components/parameters/accountId" }
      - { $ref: "#/components/parameters/id" }
    get:
      summary: Inventory size over time
      responses:
        "200": { description: OK }

  /accounts/{accountId}/loadbalancers/{id}:
    parameters:
      - { $ref: "#/components/parameters/accountId" }
      - { $ref: "#/components/parameters/id" }
    get:
      summary: One load balancer
      responses:
        "200": { description: OK }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      summary: Rename a load balancer
      responses:
        "200": { description: OK }
    delete:
      summary: Delete an empty load balancer
      responses:
        "200": { description: Deleted }

  /accounts/{accountId}/loadbalancers/{id}/nodes:
    parameters:
      - { $ref: "#/components/parameters/accountId" }
      - { $ref: "#/components/parameters/id" }
    post:
      summary: Add a node
      responses:
        "201": { description: Created }

  /accounts/{accountId}/nodes/{id}:
    parameters:
      - { $ref: "#/components/parameters/accountId" }
      - { $ref: "#/components/parameters/id" }
    patch:
      summary: Replace a node's addresses
      responses:
        "200": { description: OK }
    delete:
      summary: Remove a node
      responses:
        "200": { description: Deleted }

  /accounts/{accountId}/loadbalancers/{id}/domains:
    parameters:
      - { $ref: "#/components/parameters/accountId" }
      - { $ref: "#/components/parameters/id" }
    get:
      summary: A load balancer's domains
      responses:
        "200": { description: OK }
    post:
      summary: Add a domain, creating or reusing its challenge alias
      responses:
        "201": { description: Created }
        "409": { description: The challenge name belongs to another load balancer }

  /accounts/{accountId}/domains/{id}:
    parameters:
      - { $ref: "#/components/parameters/accountId" }
      - { $ref: "#/components/parameters/id" }
    delete:
      summary: Remove a domain, and its alias if nothing else uses it
      responses:
        "200": { description: Deleted }

  /accounts/{accountId}/loadbalancers/{id}/keys:
    parameters:
      - { $ref: "#/components/parameters/accountId" }
      - { $ref: "#/components/parameters/id" }
    get:
      summary: The keys whose authority reaches this load balancer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/ApiKey" } }
    post:
      summary: Create a key with grants over this load balancer
      description: |
        Refused unless every grant is covered by a single grant the creator holds. Coverage is not
        assembled from several held grants: the union is true only of today's inventory.
      responses:
        "201": { description: Created — the secret is in this response and nowhere else, ever }

  /accounts/{accountId}/keys/{id}/networks:
    parameters:
      - { $ref: "#/components/parameters/accountId" }
      - { $ref: "#/components/parameters/id" }
    put:
      summary: Replace a key's address restrictions
      responses:
        "200": { description: OK }

  /accounts/{accountId}/keys/{id}/expiry:
    parameters:
      - { $ref: "#/components/parameters/accountId" }
      - { $ref: "#/components/parameters/id" }
    put:
      summary: Set or clear a key's expiry
      responses:
        "200": { description: OK }

  /accounts/{accountId}/keys/{id}/rotate:
    parameters:
      - { $ref: "#/components/parameters/accountId" }
      - { $ref: "#/components/parameters/id" }
    post:
      summary: Replace a key's secret, keeping its authority exactly
      responses:
        "201": { description: Created }

  /accounts/{accountId}/keys/{id}:
    parameters:
      - { $ref: "#/components/parameters/accountId" }
      - { $ref: "#/components/parameters/id" }
    delete:
      summary: Revoke a key without deleting its history
      responses:
        "200": { description: Revoked }

  /accounts/{accountId}/loadbalancers/{id}/plan:
    parameters:
      - { $ref: "#/components/parameters/accountId" }
      - { $ref: "#/components/parameters/id" }
    get:
      summary: The DNS records the customer must publish
      responses:
        "200": { description: OK }

  /accounts/{accountId}/loadbalancers/{id}/plan/zone:
    parameters:
      - { $ref: "#/components/parameters/accountId" }
      - { $ref: "#/components/parameters/id" }
    get:
      summary: The same plan as a zone-file snippet
      responses:
        "200": { description: OK }

  /accounts/{accountId}/loadbalancers/{id}/verification:
    parameters:
      - { $ref: "#/components/parameters/accountId" }
      - { $ref: "#/components/parameters/id" }
    get:
      summary: What the plan's records actually resolve to right now
      description: >
        Answers per plan record and again per domain. With no verification
        resolver configured it still answers 200, with every domain reading
        "not-checked": a deployment that declined the feature is not broken.
      responses:
        "200": { description: OK }
    post:
      summary: The same check, run on request, and recorded
      description: >
        Identical body to the GET. The difference is that what it saw is stored:
        a delegation observed here activates its domains immediately, which is
        the "check now" for somebody who has just published the record and does
        not want to wait for the poller. It never deactivates — a check that
        fails to see a delegation records only that we looked.
      responses:
        "200": { description: OK }

  /accounts/{accountId}/loadbalancers/{id}/interactions:
    parameters:
      - { $ref: "#/components/parameters/accountId" }
      - { $ref: "#/components/parameters/id" }
    get:
      summary: Publications seen through to their end
      responses:
        "200": { description: OK }

  # All three require inventory.view in the account, like every other read of
  # what it holds. Membership alone is not enough: a member holding a role with
  # no grants is refused these exactly as they are refused the project listing.
  /accounts/{accountId}/challenges:
    parameters: [{ $ref: "#/components/parameters/accountId" }]
    get:
      summary: Values answerable right now
      responses:
        "200": { description: OK }
        "403": { description: The caller does not hold inventory.view in this account }

  /accounts/{accountId}/audit:
    parameters: [{ $ref: "#/components/parameters/accountId" }]
    get:
      summary: What changed in this account, and who changed it
      responses:
        "200": { description: OK }
        "403": { description: The caller does not hold inventory.view in this account }

  /accounts/{accountId}/config:
    parameters: [{ $ref: "#/components/parameters/accountId" }]
    get:
      summary: The effective configuration, redacted
      responses:
        "200": { description: OK }
        "403": { description: The caller does not hold inventory.view in this account }

  # Roles and members exist only in a TEAM account. In a personal account these routes are
  # REFUSED with 409 rather than answered with an empty collection, so a client can tell "there
  # are none" from "there cannot be any". API keys and their grants are not like this: the grant
  # model, and its subset rule, stay live in every account.
  /accounts/{accountId}/roles:
    parameters: [{ $ref: "#/components/parameters/accountId" }]
    get:
      summary: The roles this account defines
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Role" } }
    post:
      summary: Create a role
      responses:
        "201": { description: Created }
        "403": { description: A grant was not covered by one the writer holds }

  /accounts/{accountId}/roles/{id}:
    parameters:
      - { $ref: "#/components/parameters/accountId" }
      - { $ref: "#/components/parameters/id" }
    put:
      summary: Replace a role's name, description and grants
      responses:
        "200": { description: OK }
        "409": { description: The unrestricted role cannot be changed }
    delete:
      summary: Delete a role that has no members
      responses:
        "204": { description: Deleted }

  /accounts/{accountId}/members:
    parameters: [{ $ref: "#/components/parameters/accountId" }]
    get:
      summary: Who is in this account
      description: Readable by any member without a grant.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Member" } }
    post:
      summary: Add a member
      responses:
        "204": { description: Added }

  /accounts/{accountId}/members/{id}:
    parameters:
      - { $ref: "#/components/parameters/accountId" }
      - { $ref: "#/components/parameters/id" }
    delete:
      summary: Remove a member
      responses:
        "204": { description: Removed }
        "409": { description: This would leave the unrestricted role with no member }

  /accounts/{accountId}/transfer:
    post:
      summary: Hand a team account to another user
      description: |
        The recipient is named by identity-provider subject, and is given an unrestricted
        membership in the same transaction — an owner who is not a member cannot open their own
        account. Only the current owner may do it.

        A personal account is never transferred: it is one person's own workspace, and handing it
        over would make it a team account with the team parts missing.
      parameters: [{ $ref: "#/components/parameters/accountId" }]
      responses:
        "204": { description: Transferred }
        "403": { description: The caller is not the account's owner }
        "409": { description: This account cannot be transferred }

  /sessions:
    get:
      summary: Your own console sessions
      description: |
        The sessions of the person making the request, and nobody else's. A session belongs to a
        person rather than to an account, so there is no account-level authority over one.
      responses:
        "200": { description: OK }
    delete:
      summary: Sign out everywhere
      description: |
        Ends every session the caller holds. The optional `subject` query parameter is a check
        rather than a target: naming anybody but yourself is refused.
      parameters:
        - { name: subject, in: query, required: false, schema: { type: string } }
      responses:
        "200": { description: OK }
        "403": { description: The named subject is not the caller }

  /sessions/{handle}:
    parameters:
      - { name: handle, in: path, required: true, schema: { type: string } }
    delete:
      summary: End one of your own sessions
      responses:
        "200": { description: OK }
        "404": { description: You hold no valid session with that handle }
