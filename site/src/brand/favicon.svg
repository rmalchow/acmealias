<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!--
  THE FAVICON, which is a different picture from brand/logo.svg even though it is the
  same mark.

  logo.svg is transparent, because in the page it sits inside a box the console tints
  with the accent (shared/src/lib/ui/shell.component.ts, `.brand-box`) and the
  marketing bar draws it against the bar's own ground. A black plate baked into that
  file would put a black block inside a green box.

  A favicon has no such box. It is composited by the BROWSER, against a tab strip
  whose colour is the browser's business and changes with the user's theme — and the
  mark is a hairline outline with no fill, which disappears on a light tab strip. So
  this one carries its own ground, and carries it black because that is the ground the
  mark was drawn against everywhere else.

  Square, because a tab is square: logo.svg's 15.179 x 9.914 would be letterboxed and
  the mark rendered at the height that fits the width, i.e. small. Here it is scaled to
  the square and centred, which is why it reads at 16 pixels.

  The paths are copied VERBATIM from logo.svg rather than redrawn, so the two cannot
  drift. If the mark changes, both files change together or this comment is a lie.
-->
