name: acmeservice-dev

# Local development stack — design D12, plus the DNS-01 rehearsal rig of D14.
#
# EVERYTHING runs in a container, including the Go binary (under `air`) and the
# Angular dev server (under `ng serve`), both live-reloading off bind-mounted
# source. Nothing here talks to the host: one bridge network, every service
# reachable by name. The only things published to the host are the ports a
# developer actually points a browser or a `dig` at.
#
# No named volumes anywhere — every stateful service and every build cache
# bind-mounts under ./data/<name>/ so `development/scripts/reset.sh` is an
# `rm -rf`. The caches in particular live under data/ rather than in the source
# tree so container-created, root-owned artefacts never land in backend/ or
# frontend/. See development/scripts/lib.sh, DATA_DIRS.
#
# Two profiles:
#   (default)   postgres, authentik (server+worker+redis), mailpit, www, coredns,
#               api, web-console, web-admin, traefik — the dev loop.
#   acme        pebble, traefik-lb, whoami — a fake CA and a customer-like load
#               balancer that really obtains a certificate over DNS-01.
#               Opt in with: development/scripts/up.sh --acme
#
# `dns: ["172.28.0.53"]` on every service does NOT break resolution of
# container names: /etc/resolv.conf still points at Docker's embedded resolver
# (127.0.0.11), which answers service names itself and only forwards names it
# cannot answer to what `dns:` names. CoreDNS lives in the default profile
# precisely so that this setting is always valid — a resolver that exists only
# under a profile would break name resolution for everyone whenever the
# profile is off.

# ---------------------------------------------------------------------------
# Shared templates
# ---------------------------------------------------------------------------

# Every container that runs OUR code runs as the invoking user. Without it the
# caches under data/ (node_modules, the Go module and build caches) are written
# by root, and deleting them needs a throwaway root container — which is why
# lib.sh has one. Postgres and the off-the-shelf images keep their own users:
# the postgres entrypoint chowns PGDATA itself and refuses to be told otherwise.
#
# The :-0 fallbacks keep a bare `docker compose` working for anyone who runs it
# without going through development/scripts, which export these. That falls back
# to today's behaviour (root) rather than to a wrong uid. They are DEV_UID/DEV_GID
# rather than UID/GID because bash makes UID readonly and exports neither.
x-runs-our-code: &runs-our-code
  user: "${DEV_UID:-0}:${DEV_GID:-0}"
  restart: unless-stopped
  dns: ["172.28.0.53"]

# The two Angular dev servers differ in three things — project, port and
# hostname — and agreed on everything else by being copied from one another,
# which is how they drifted apart the first time. One template now.
x-ng-service: &ng-service
  <<: *runs-our-code
  image: acmeservice-frontend-dev:latest
  # Built locally; never published, so compose must not try to pull it.
  pull_policy: never
  working_dir: /app
  volumes:
    - ../frontend:/app
    - ./data/node_modules:/app/node_modules
    - ./data/npm_cache:/npm-cache
  depends_on:
    frontend-install:
      condition: service_completed_successfully

# Probe often while the application is still compiling, so it is marked healthy
# within seconds of actually answering — and do not count those early probes as
# failures. A first `ng serve` on a cold cache is minutes.
x-ng-healthcheck: &ng-healthcheck
  interval: 30s
  timeout: 10s
  retries: 3
  start_period: 300s
  start_interval: 2s

networks:
  default:
    name: acmeservice-dev
    ipam:
      config:
        # Fixed subnet because three addresses in it are written into config
        # files rather than resolved: CoreDNS's own (it goes into resolv.conf
        # before any name resolution exists), the api's (CoreDNS's `forward`
        # takes an IP, never a name), traefik-lb's (it is the A record the
        # fake example.com zone hands out) and the dev overlay's (the
        # *.localhost names resolve to it).
        - subnet: 172.28.0.0/24

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    dns: ["172.28.0.53"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      # The role the service connects as: not a superuser, so row-level
      # security actually applies to it. See postgres-init/02-create-app-role.sh.
      ACME_DB_ROLE: ${ACME_DB_ROLE}
      ACME_DB_PASSWORD: ${ACME_DB_PASSWORD}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 2s
      timeout: 2s
      retries: 30

  # The identity provider (design K1). Reachable as `http://auth.localhost` from
  # BOTH sides, which is the whole reason for the odd hostname: the OIDC issuer
  # string has to be one URL that the browser on the host and the api container
  # can each open, because go-oidc requires the issuer it discovers to match the
  # one it was configured with.
  #
  # Three containers where Keycloak was one. The server answers HTTP, the worker
  # runs the background tasks INCLUDING blueprint application, and Redis is the
  # queue between them. Its database lives in the postgres container this stack
  # already runs (postgres-init/03-create-authentik-db.sh), not a second server.
  #
  # AUTHENTIK_BOOTSTRAP_* seeds the initial admin on the first start, so nobody
  # has to walk the out-of-box setup flow to get a usable stack.
  authentik-server:
    image: ghcr.io/goauthentik/server:2024.10
    restart: unless-stopped
    dns: ["172.28.0.53"]
    command: server
    networks:
      default:
        ipv4_address: 172.28.0.20
    environment: &authentik-env
      AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY}
      AUTHENTIK_POSTGRESQL__HOST: postgres
      AUTHENTIK_POSTGRESQL__NAME: ${AUTHENTIK_DB_NAME}
      AUTHENTIK_POSTGRESQL__USER: ${AUTHENTIK_DB_ROLE}
      AUTHENTIK_POSTGRESQL__PASSWORD: ${AUTHENTIK_DB_PASSWORD}
      AUTHENTIK_REDIS__HOST: redis
      # Behind the overlay on plain HTTP. Without this authentik builds its
      # redirect and issuer URLs from its own :9000 and every sign-in bounces to
      # a URL the browser cannot reach.
      AUTHENTIK_LISTEN__TRUSTED_PROXY_CIDRS: 172.28.0.0/24
      # NO AUTHENTIK_COOKIE_DOMAIN. Setting it to `localhost` makes authentik
      # send `Domain=localhost` on its session cookie, and a browser REFUSES
      # that from auth.localhost: `localhost` is effectively a top-level
      # domain, and a domain cookie on one is not allowed. The cookie is then
      # never stored, the flow cannot progress, and the login page re-renders
      # with no error at all — which reads as a wrong password. Left unset,
      # the cookie is host-only on auth.localhost, which is what is wanted:
      # nothing else in this stack should ever see authentik's session.
      AUTHENTIK_DISABLE_STARTUP_ANALYTICS: "true"
      AUTHENTIK_ERROR_REPORTING__ENABLED: "false"
      AUTHENTIK_BOOTSTRAP_EMAIL: ${AUTHENTIK_BOOTSTRAP_EMAIL}
      AUTHENTIK_BOOTSTRAP_PASSWORD: ${AUTHENTIK_BOOTSTRAP_PASSWORD}
      AUTHENTIK_BOOTSTRAP_TOKEN: ${AUTHENTIK_BOOTSTRAP_TOKEN}
      # Everything it sends goes to the stack's mail sink. The service name, not
      # mail.localhost: SMTP does not traverse the HTTP overlay.
      AUTHENTIK_EMAIL__HOST: mailpit
      AUTHENTIK_EMAIL__PORT: "1025"
      AUTHENTIK_EMAIL__USE_TLS: "false"
      AUTHENTIK_EMAIL__FROM: no-reply@acmeservice.internal
    volumes:
      - ./authentik/blueprints:/blueprints/custom:ro
      - ./data/authentik_media:/media
      # Our sign-in page, as two files over two the image already serves.
      #
      # /web/dist is what the server publishes at /static/dist, and every flow
      # page loads /static/dist/custom.css — the image ships that file empty
      # precisely so it can be replaced. The logo goes in beside it rather than
      # into /media, because /media is ./data/, which `reset.sh` deletes: an
      # asset the blueprint names must survive a reset or the login page comes
      # back with a broken image.
      - ./authentik/branding/custom.css:/web/dist/custom.css:ro
      - ./authentik/branding/logo.png:/web/dist/brand/logo.png:ro
      # And the third file replaces the photograph authentik puts behind the
      # login card. That one is NOT a setting anywhere: a flow with no background
      # of its own falls back to this exact path in the image, and a flow field
      # left empty means "use the default", not "use nothing". So the way to get
      # rid of the picture is to be the picture — this one is our black with the
      # highlight painted into it.
      - ./authentik/branding/flow_background.jpg:/web/dist/assets/images/flow_background.jpg:ro
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    labels:
      traefik.enable: "true"
      traefik.http.routers.authentik.rule: "Host(`auth.localhost`)"
      traefik.http.routers.authentik.entrypoints: web
      traefik.http.services.authentik.loadbalancer.server.port: "9000"
    healthcheck:
      test: ["CMD", "ak", "healthcheck"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 60s

  # Same image, same environment, different command. The worker is what APPLIES
  # BLUEPRINTS — so a stack whose worker is unhealthy comes up with an identity
  # provider that has no groups, no users and no clients, and the failure looks
  # like a login problem rather than a worker problem.
  authentik-worker:
    image: ghcr.io/goauthentik/server:2024.10
    restart: unless-stopped
    dns: ["172.28.0.53"]
    command: worker
    environment: *authentik-env
    volumes:
      - ./authentik/blueprints:/blueprints/custom:ro
      - ./data/authentik_media:/media
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}

  # The queue between the two above, and nothing else uses it.
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    dns: ["172.28.0.53"]
    networks:
      default:
        ipv4_address: 172.28.0.21
    command: ["redis-server", "--save", "60", "1", "--loglevel", "warning"]
    volumes:
      - ./data/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  # The marketing site, at http://www.localhost.
  #
  # busybox httpd, which is about as small as a web server gets while still being
  # something you already trust: one static binary, no configuration file, and no
  # image to keep patched beyond busybox itself. `-f` keeps it in the foreground
  # so Docker supervises it rather than watching a daemon exit successfully.
  #
  # It serves site/dist, which is gitignored build output — so `./site/build.sh`
  # has to have run. up.sh runs it, and the volume is read-only because nothing
  # here should ever write back into a build directory.
  www:
    image: busybox:1.37
    restart: unless-stopped
    dns: ["172.28.0.53"]
    working_dir: /site
    command: ["httpd", "-f", "-v", "-p", "8080", "-h", "/site"]
    volumes:
      - ../site/dist:/site:ro
    labels:
      traefik.enable: "true"
      traefik.http.routers.www.rule: "Host(`www.localhost`)"
      traefik.http.routers.www.entrypoints: web
      traefik.http.services.www.loadbalancer.server.port: "8080"

  # Where every mail the stack sends ends up, and where none of it leaves from.
  #
  # An identity provider that can enrol people sends mail — a verification link,
  # a password reset — and `account-invitations` will send more. In development
  # all of it has to go somewhere that is NOT a real mailbox: a stack that can
  # reach a real SMTP relay is a stack that can mail a real person from a test,
  # and the addresses in development/authentik/blueprints/acmeservice.yaml are
  # `@acmeservice.internal` precisely so that nothing would arrive if it tried.
  #
  # mailpit is an SMTP server that accepts everything, delivers nothing, and
  # shows what it caught in a web interface at http://mail.localhost. It is one
  # small Go binary with no database.
  #
  # Two ports, and the distinction matters when configuring a sender:
  #   1025  SMTP, reachable inside the network as `mailpit:1025` — this is what
  #         goes in an identity provider's mail settings, NOT the hostname
  #         below, because SMTP does not go through the HTTP overlay.
  #   8025  the web interface, routed by Traefik as http://mail.localhost.
  #
  # No credentials and no TLS: it accepts anything, which is the point, and it
  # is bound to the stack's own network rather than published to the host.
  mailpit:
    image: axllent/mailpit:v1.21
    restart: unless-stopped
    dns: ["172.28.0.53"]
    environment:
      # Keep what it caught across a restart, so a link captured before a
      # `dev.sh restart` is still clickable afterwards.
      MP_DATABASE: /data/mailpit.db
      MP_MAX_MESSAGES: "500"
      # It is behind the overlay and reachable by anyone who can reach the
      # stack; saying so explicitly stops it from also being an open relay to
      # the outside, which is the one way a mail sink can do harm.
      MP_SMTP_BIND_ADDR: "0.0.0.0:1025"
    volumes:
      - ./data/mailpit:/data
    labels:
      traefik.enable: "true"
      traefik.http.routers.mailpit.rule: "Host(`mail.localhost`)"
      traefik.http.routers.mailpit.entrypoints: web
      traefik.http.services.mailpit.loadbalancer.server.port: "8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 3s
      timeout: 3s
      retries: 20

  # The fake internet's DNS. Authoritative for example.com (RFC 2606 reserves
  # it, so hijacking it is safe), forwards our own zone to the api container's
  # authoritative listener, and forwards everything else to a real upstream so
  # containers still reach the internet. See development/dns/Corefile.
  coredns:
    image: coredns/coredns:1.11.3
    restart: unless-stopped
    command: ["-conf", "/etc/coredns/Corefile"]
    networks:
      default:
        ipv4_address: 172.28.0.53
    volumes:
      - ./dns:/etc/coredns:ro
    ports:
      # The fake internet's resolver, on all interfaces so another machine can
      # point at it and see the same hijacked example.com.
      - "8053:53/udp"
      - "8053:53/tcp"

  # The Go service, rebuilt and restarted by air on every .go change. Source is
  # bind-mounted; the module cache, build cache and air's output directory are
  # mounted out of it so nothing root-owned is created inside backend/.
  #
  # Linux propagates inotify events through bind mounts, so the watcher works
  # as-is. On Docker Desktop (macOS/Windows) it usually does not — the knob is
  # `poll = true` in backend/.air.toml. Do not turn it on here; it burns CPU
  # for nothing on Linux.
  api:
    <<: *runs-our-code
    image: acmeservice-go-dev:latest
    build:
      context: .
      dockerfile: Dockerfile.go
    pull_policy: never
    networks:
      default:
        ipv4_address: 172.28.0.10
    env_file: [.env]
    environment:
      CGO_ENABLED: "0"
      # The base file, named explicitly: an explicitly configured base that is
      # absent is a startup error (design G4), which is what turns a broken
      # mount into a loud failure instead of a stack quietly running on
      # defaults nobody chose. The overlay is found beside it, by name —
      # config.yaml + the profile below.
      ACME_CONFIG_FILE: /etc/acmeservice/config.yaml
      ACME_PROFILES: development
    working_dir: /src
    command: ["air", "-c", ".air.toml"]
    volumes:
      - ../backend:/src
      # Mounted over the bind above rather than copied into backend/, because
      # the base file belongs to the repository and not to the Go module.
      # Mounted OUTSIDE /src, which is the bind-mounted backend/ tree. Docker
      # creates a missing mount point inside the host directory it is mounting
      # into, as root — so mounting these at /src/config.yaml left two
      # zero-byte, root-owned files in backend/ that a developer could not
      # delete without sudo. That is precisely the artefact lib.sh's DATA_DIRS
      # comment exists to prevent, arriving by a route it did not anticipate.
      - ../config.yaml:/etc/acmeservice/config.yaml:ro
      - ./config-development.yaml:/etc/acmeservice/config-development.yaml:ro
      - ./data/go_mod:/go/pkg/mod
      - ./data/go_build:/gocache
      - ./data/air_tmp:/src/tmp
    depends_on:
      postgres: {condition: service_healthy}
    labels:
      traefik.enable: "true"

      # The admin API under the CONSOLE's own origin. Higher priority than the
      # SPA's catch-all on the same hostname, so `/api` can never be shadowed
      # by it.
      # Both console origins. Each Angular application calls /api on its OWN
      # origin, because the session and CSRF cookies are host-only: a call from
      # admin.localhost to console.localhost would carry no session, and no CORS
      # header can put one back.
      traefik.http.routers.admin-api.rule: "(Host(`console.localhost`) || Host(`admin.localhost`)) && PathPrefix(`/api`)"
      traefik.http.routers.admin-api.priority: "100"
      traefik.http.routers.admin-api.entrypoints: web
      traefik.http.routers.admin-api.service: admin-api

      # The same admin API on a hostname of its own, for everything that is
      # NOT the browser session: curl, the CLI, an API-key client.
      #
      # The console must keep calling its own origin's /api rather than this
      # one. The session and CSRF cookies are host-only and `SameSite=Lax`,
      # and browsers compute "same site" from the registrable domain —
      # `localhost` is not a public suffix, so `console.localhost` and
      # `acme-api.localhost` are two different sites, not two hosts of one
      # site. An XHR between them would carry no session cookie, and no CORS
      # header can put it back: SameSite is a browser rule, not a server one.
      traefik.http.routers.admin-api-host.rule: "Host(`acme-api.localhost`)"
      traefik.http.routers.admin-api-host.priority: "100"
      traefik.http.routers.admin-api-host.entrypoints: web
      traefik.http.routers.admin-api-host.service: admin-api

      # The ACME challenge API (lego's httpreq endpoint). traefik-lb reaches
      # it as http://api:8080 on the network without going through here; this
      # route exists so a developer can curl /present and /cleanup by hand.
      traefik.http.routers.challenge-api.rule: "Host(`acme-challenge.localhost`)"
      traefik.http.routers.challenge-api.entrypoints: web
      traefik.http.routers.challenge-api.service: challenge-api

      traefik.http.services.admin-api.loadbalancer.server.port: "8080"
      traefik.http.services.challenge-api.loadbalancer.server.port: "8080"
    ports:
      # Not HTTP, so the overlay cannot carry it: our authoritative DNS, for
      # `dig -p 8153`. Every HTTP surface of this container is a route above.
      - "8153:8053/udp"
      - "8153:8053/tcp"

  # `ng serve` in a container. node_modules is its OWN mount rather than part
  # of the bind-mounted tree: mounting ./frontend over /app would otherwise
  # hide anything the image installed, and this way the container's dependency
  # tree and a developer's host-side frontend/node_modules never touch each
  # other. It starts out empty, hence the `npm ci` guard.
  # ONE install, not two racing. Both dev servers share ../frontend and its
  # node_modules mount, and a `[ -d node_modules/@angular/cli ] || npm ci` guard
  # in each of them is a race when they start together against an empty mount:
  # two `npm ci` processes writing one tree. This one-shot runs first and the
  # servers wait for it to EXIT SUCCESSFULLY, which is a thing compose knows how
  # to express and a polling loop in a shell command is not.
  frontend-install:
    <<: *runs-our-code
    image: acmeservice-frontend-dev:latest
    build:
      context: .
      dockerfile: Dockerfile.frontend
    pull_policy: never
    restart: "no"
    working_dir: /app
    volumes:
      - ../frontend:/app
      - ./data/node_modules:/app/node_modules
      - ./data/npm_cache:/npm-cache
    # `npm ci` on every start would delete and refetch node_modules each time.
    # The guard makes this idempotent: present means a previous run finished.
    command: sh -c '[ -d node_modules/@angular/cli ] || npm ci'

  # Two applications, two dev servers, two origins. `ng serve` builds one project
  # at a time, so the customer console and the staff console each get their own
  # container — which also mirrors production, where they are two bundles chosen
  # by hostname rather than one bundle with a staff section in it.
  #
  # They share node_modules and the npm cache — one workspace, one install — but
  # NOT the Angular build cache. Two concurrent `ng serve` processes writing one
  # .angular/cache serve each other's bundles: the symptom is console.localhost
  # answering with the staff application, which looks like a routing mistake and
  # is not. Found exactly that way.
  web-console:
    <<: *ng-service
    command: npx ng serve console --host 0.0.0.0 --disable-host-check --port 4200
    volumes:
      - ../frontend:/app
      - ./data/node_modules:/app/node_modules
      - ./data/npm_cache:/npm-cache
      - ./data/ng_cache_console:/app/.angular/cache
    labels:
      traefik.enable: "true"
      # The catch-all for the customer origin: everything the admin-api router
      # above did not claim, HMR websocket included — Traefik forwards
      # `Upgrade`/`Connection` on any matched route by default.
      traefik.http.routers.spa-console.rule: "Host(`console.localhost`)"
      traefik.http.routers.spa-console.priority: "1"
      traefik.http.routers.spa-console.entrypoints: web
      traefik.http.services.spa-console.loadbalancer.server.port: "4200"
    healthcheck:
      <<: *ng-healthcheck
      test: ["CMD", "curl", "-fsS", "http://localhost:4200/"]

  web-admin:
    <<: *ng-service
    command: npx ng serve admin --host 0.0.0.0 --disable-host-check --port 4201
    volumes:
      - ../frontend:/app
      - ./data/node_modules:/app/node_modules
      - ./data/npm_cache:/npm-cache
      - ./data/ng_cache_admin:/app/.angular/cache
    labels:
      traefik.enable: "true"
      traefik.http.routers.spa-admin.rule: "Host(`admin.localhost`)"
      traefik.http.routers.spa-admin.priority: "1"
      traefik.http.routers.spa-admin.entrypoints: web
      traefik.http.services.spa-admin.loadbalancer.server.port: "4201"
    healthcheck:
      <<: *ng-healthcheck
      test: ["CMD", "curl", "-fsS", "http://localhost:4201/"]

  # Dev-only reverse proxy. It presents the console and its admin API at one
  # origin, http://console.localhost — design D12 explains why one origin
  # matters (session cookie SameSite=Lax + CSRF, no dev-only CORS branch) — and
  # additionally gives the API and the IdP hostnames of their own,
  # http://acme-api.localhost and http://auth.localhost. See the labels on
  # the `api` service for why the console must NOT call the api hostname.
  #
  # Static address: the *.localhost names above are answered inside the stack
  # from development/dns/hosts, and CoreDNS's hosts plugin takes an address,
  # never a service name.
  #
  # The routes live as labels on the services themselves; this reads them off
  # the Docker socket, mounted read-only. Nothing else in the stack publishes
  # an HTTP port to the host any more — one way in, on :80, by name.
  traefik:
    # v3.6, not the v3.1 the customer-like traefik-lb below runs: everything
    # up to v3.5 asks the Docker socket for API 1.24, which Docker 29 refuses
    # ("client version 1.24 is too old"), and the provider then builds no
    # routes at all. The version is hardcoded in those releases — no
    # DOCKER_API_VERSION or config knob moves it — so the fix is the image.
    # traefik-lb touches no socket and stays on v3.1 on purpose: it is the
    # stand-in for whatever a customer already runs.
    image: traefik:v3.6
    restart: unless-stopped
    dns: ["172.28.0.53"]
    networks:
      default:
        ipv4_address: 172.28.0.40
        # Every dev hostname IS this container, as far as the stack is
        # concerned. Docker's embedded resolver (127.0.0.11, which every
        # container consults before the `dns:` server below it) answers these
        # aliases itself, so nothing has to be written into CoreDNS's hosts
        # file and no address is hardcoded anywhere. On the host side the
        # names need no configuration either: *.localhost is loopback by
        # definition (RFC 6761), and loopback:80 is this container's
        # published port. One URL, both sides.
        aliases:
          - console.localhost
          - admin.localhost
          - acme-api.localhost
          - acme-challenge.localhost
          - auth.localhost
          - www.localhost
          - mail.localhost
    command:
      - "--configFile=/etc/traefik/traefik.yaml"
    volumes:
      - ./traefik:/etc/traefik:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      # All interfaces, not just loopback: the console has to be reachable
      # from another machine on the LAN (a phone, a second laptop, a
      # colleague) — this is a trusted network and a throwaway stack. Note
      # that only the *port* is open that way; the hostnames still have to
      # resolve, so a visitor needs the names in their own hosts file.
      - "80:80"
    depends_on: [api, web-console, web-admin, authentik-server]

  # ---------------------------------------------------------------------------
  # profile: acme — the DNS-01 rehearsal rig (design D14, in miniature)
  # ---------------------------------------------------------------------------

  # Let's Encrypt's own test CA. Real ACME protocol, real DNS-01 validation
  # against our fake internet, throwaway certificates, no rate limits.
  # NOSLEEP and NONCEREJECT off: pebble deliberately injects delays and rejects
  # ~5% of nonces to shake out *client* bugs. The client is not what we are
  # testing here, so that is pure flakiness.
  pebble:
    image: ghcr.io/letsencrypt/pebble:latest
    profiles: [acme]
    restart: unless-stopped
    dns: ["172.28.0.53"]
    command: ["-config", "/test/config/pebble-config.json", "-dnsserver", "coredns:53"]
    environment:
      PEBBLE_VA_NOSLEEP: "1"
      PEBBLE_WFE_NONCEREJECT: "0"
    ports:
      - "127.0.0.1:14000:14000"   # ACME directory
      - "127.0.0.1:15000:15000"   # management API (roots, at /roots/0)
    depends_on: [coredns]

  # A customer-like load balancer: stock Traefik, real configuration, actually
  # obtains a certificate for demo.example.com + *.demo.example.com over
  # DNS-01 through our service. Nothing about it is stubbed — the claim under
  # test is precisely that unmodified Traefik works against this service.
  traefik-lb:
    image: traefik:v3.1
    profiles: [acme]
    restart: unless-stopped
    dns: ["172.28.0.53"]
    networks:
      default:
        ipv4_address: 172.28.0.30
    command: ["--configFile=/etc/traefik/traefik.yaml"]
    environment:
      # lego posts challenges to our challenge API...
      HTTPREQ_ENDPOINT: "http://api:8080/"
      # ...and must trust pebble's throwaway CA to talk to it at all.
      # up.sh --acme copies this out of the pebble image.
      LEGO_CA_CERTIFICATES: /pebble/minica.pem
    # HTTPREQ_USERNAME / HTTPREQ_PASSWORD for the API key, which only exists
    # once the seed has run: the secret is displayed exactly once by
    # `adminctl key create`, so seed.sh captures it into this file. up.sh
    # writes an empty placeholder so compose does not fail before the seed.
    env_file: [./data/acme-key.env]
    volumes:
      - ./traefik-lb:/etc/traefik:ro
      - ./data/traefik_lb:/data
      - ./data/pebble:/pebble:ro
    ports:
      # All interfaces, same reasoning as the overlay's :80.
      - "443:443"
    depends_on: [pebble, coredns]

  whoami:
    image: traefik/whoami:v1.10
    profiles: [acme]
    restart: unless-stopped
    dns: ["172.28.0.53"]
