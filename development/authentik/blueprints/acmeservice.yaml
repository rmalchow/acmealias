# The development identity provider, as data.
#
# This is authentik's equivalent of the Keycloak realm export it replaces
# (development/realm/acmeservice-realm.json): a description of the objects that
# must exist, applied at start-up and re-applied when this file changes. The
# property being preserved is the one that made the realm import worth having —
# `./scripts/dev.sh reset` produces an identical, working identity provider from
# an empty directory, with nobody clicking anything (design K2).
#
# SCOPE OF THIS FILE TODAY: groups, users, the console application and the group
# claim — tasks 1.1 to 1.4. The enrolment flow that lets a person register
# themselves, and the brand that makes the pages look like the product, arrive
# with task group 5.
#
# ------------------------------------------------------------------------------
# UNVALIDATED. Read this before trusting any line below.
#
# This file was written from documentation, not against a running authentik, and
# authentik's blueprint schema is version-specific in ways that are easy to get
# wrong and awkward to debug:
#
#   - model names (`authentik_providers_oauth2.scopemapping` and friends) have
#     moved between releases;
#   - `redirect_uris` was once a newline-separated string and is now a list of
#     objects with a `matching_mode`;
#   - whether a password may be set inline on a user has changed;
#   - the slugs of the built-in flows referenced by !Find below must actually
#     exist in the image the stack pins.
#
# Task 1.5 is to validate this against a running instance and correct it. Until
# that task is ticked, treat this as a draft that states the intent correctly and
# the syntax only probably.
# ------------------------------------------------------------------------------

version: 1

metadata:
  name: acmeservice-dev
  labels:
    blueprints.goauthentik.io/instantiate: "true"

entries:
  # --- groups -----------------------------------------------------------------
  #
  # These four names are not decorative and must not be tidied. Each is named by
  # a setting in development/.env (ACME_ADMIN_GROUP and its three siblings), and
  # each is asserted by name in backend/acceptance/identity_test.go. A role whose
  # configured group does not exist grants nothing, and the service reports that
  # at start-up rather than failing later (design K3).

  - model: authentik_core.group
    id: group-admin
    identifiers:
      name: acme-admin
    attrs:
      name: acme-admin

  - model: authentik_core.group
    id: group-config-admin
    identifiers:
      name: acme-config-admin
    attrs:
      name: acme-config-admin

  - model: authentik_core.group
    id: group-key-rotation
    identifiers:
      name: acme-key-rotation
    attrs:
      name: acme-key-rotation

  - model: authentik_core.group
    id: group-read-only
    identifiers:
      name: acme-read-only
    attrs:
      name: acme-read-only

  # --- users ------------------------------------------------------------------
  #
  # Four users, one group each, all with the password `devpass`. ./scripts/dev.sh
  # status prints these logins to whoever brings the stack up, and the acceptance
  # suite signs in as every one of them to prove that each resolves to exactly the
  # role its group is configured to grant.
  #
  # `type: internal` is deliberate for all four: these are the development
  # stand-ins for staff. The `external` user type is what public-edition U12
  # reserves for customers, and the first external users this stack sees will be
  # the ones who register themselves in task group 5.

  - model: authentik_core.user
    identifiers:
      username: admin-user
    attrs:
      username: admin-user
      name: Admin Dev
      email: admin-user@acmeservice.internal
      password: devpass
      is_active: true
      type: internal
      groups:
        - !KeyOf group-admin

  - model: authentik_core.user
    identifiers:
      username: config-admin-user
    attrs:
      username: config-admin-user
      name: Config Admin Dev
      email: config-admin-user@acmeservice.internal
      password: devpass
      is_active: true
      type: internal
      groups:
        - !KeyOf group-config-admin

  - model: authentik_core.user
    identifiers:
      username: key-rotation-user
    attrs:
      username: key-rotation-user
      name: Key Rotation Dev
      email: key-rotation-user@acmeservice.internal
      password: devpass
      is_active: true
      type: internal
      groups:
        - !KeyOf group-key-rotation

  - model: authentik_core.user
    identifiers:
      username: read-only-user
    attrs:
      username: read-only-user
      name: Read Only Dev
      email: read-only-user@acmeservice.internal
      password: devpass
      is_active: true
      type: internal
      groups:
        - !KeyOf group-read-only

  # --- the group claim --------------------------------------------------------
  #
  # THE MOST IMPORTANT TWELVE LINES IN THIS FILE (design K3).
  #
  # Roles are derived by comparing the `groups` claim of the identity token
  # against one setting per role. What matters is the SHAPE of that list: bare
  # names (`acme-admin`), not paths (`/acme-admin`).
  #
  # Our service has a setting, ACME_OIDC_GROUP_PREFIX, whose entire purpose is to
  # absorb providers that disagree about this. The decision is to emit the right
  # shape here and leave that setting empty, so development exercises the same
  # code path production will. A stack that needed a non-empty prefix would be
  # testing the prefix rather than the mapping.
  #
  # The failure this prevents is nasty because it does not look like itself: a
  # token carrying `/acme-admin` where `acme-admin` was expected produces "you are
  # in none of the configured groups", which reads as a permissions problem and is
  # a claim-shape problem.

  - model: authentik_providers_oauth2.scopemapping
    id: mapping-groups
    identifiers:
      name: acmeservice-groups
    attrs:
      name: acmeservice-groups
      scope_name: groups
      description: "The group names this user belongs to, unqualified."
      expression: |
        return [group.name for group in request.user.ak_groups.all()]

  # --- the console application ------------------------------------------------
  #
  # The client id and secret match development/.env. The secret is `dev-console-secret`
  # in a file committed to the repository, which is correct for a stack that only
  # ever runs on a developer's machine and is stated here so nobody mistakes it for
  # an accident.
  #
  # The redirect URL must be exactly the one the service asks for. It is built
  # from ACME_OIDC_REDIRECT_URL and is the one URL in this file that, if wrong,
  # fails at the very last hop of sign-in with an error from authentik rather than
  # from us.

  - model: authentik_providers_oauth2.oauth2provider
    id: provider-console
    identifiers:
      name: acmeservice-console
    attrs:
      name: acmeservice-console
      client_type: confidential
      client_id: acmeservice-console
      client_secret: dev-console-secret
      sub_mode: hashed_user_id
      include_claims_in_id_token: true
      redirect_uris:
        - url: http://acme-console.localhost/api/v1/auth/callback
          matching_mode: strict
      authorization_flow:
        !Find [
          authentik_flows.flow,
          [slug, default-provider-authorization-implicit-consent],
        ]
      invalidation_flow:
        !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, email]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, profile]]
        - !KeyOf mapping-groups

  # The application is what a user sees and what access is bound to; the provider
  # above is the protocol machinery behind it. The slug is load-bearing: it is the
  # `acmeservice-console` in the issuer URL
  # http://auth.localhost/application/o/acmeservice-console/ that
  # ACME_OIDC_ISSUER is set to, and the issuer is validated on every token.
  - model: authentik_core.application
    identifiers:
      slug: acmeservice-console
    attrs:
      name: acmeservice
      slug: acmeservice-console
      provider: !KeyOf provider-console
      meta_description: "Certificate challenge handling for domains whose DNS you keep where it is."
