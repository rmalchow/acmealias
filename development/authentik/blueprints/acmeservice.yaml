# The development identity provider, as data.
#
# authentik's equivalent of the Keycloak realm export it replaces: a description
# of the objects that must exist, applied at start-up by the WORKER and re-applied
# when this file changes. The property being preserved is the one that made the
# realm import worth having — `./scripts/dev.sh reset` produces an identical,
# working identity provider from an empty directory, with nobody clicking
# anything (design K2).
#
# TWO APPLICATIONS, AND THAT IS THE POINT.
#
# `acmeservice-console` is the customer surface at console.localhost.
# `acmeservice-admin` is the staff surface at admin.localhost. They are separate
# applications with separate OIDC clients, so a token minted for one is not a
# token for the other — the property public-edition U12 rests its whole
# staff/customer separation on. In production they also carry different user
# types (customers `external`, staff `internal`); development has no such
# distinction to make yet and both test users are ordinary.
#
# If this file is edited and nothing changes, look at the WORKER's logs, not the
# server's. Blueprints are applied by the worker, so a stack whose worker is
# unhealthy comes up with an identity provider that has no groups, no users and
# no clients — and the failure presents as a login problem.

version: 1

metadata:
  name: acmeservice-dev
  labels:
    blueprints.goauthentik.io/instantiate: "true"

entries:
  # --- groups -----------------------------------------------------------------
  #
  # THESE GROUPS NO LONGER GRANT ANYTHING (design C10, task 2.7).
  #
  # Each used to be named by a setting in development/.env (ACME_ADMIN_GROUP and
  # its three siblings) and turned into one of four global roles at every request.
  # Roles are membership rows inside an account now, and nothing an identity
  # provider says confers authority. The four ACME_*_GROUP settings are gone.
  #
  # They are kept rather than deleted, for two reasons that are worth separating:
  #
  #   1. acme-admin is what the STAFF application is restricted to, further down
  #      this file. That is a different mechanism — who may open admin.localhost —
  #      and deleting the group would lock everybody out of the staff console
  #      while looking like tidying up after the role mapping.
  #
  #   2. The acceptance suite still wants four distinguishable people, so that a
  #      test can invite each into an account with a different role and see the
  #      difference. What changes is where the role comes from: an invitation
  #      rather than a claim. The groups themselves are now just labels on those
  #      users, and a later change may drop them once nothing reads them.

  - model: authentik_core.group
    id: group-admin
    identifiers: { name: acme-admin }
    attrs: { name: acme-admin }

  - model: authentik_core.group
    id: group-config-admin
    identifiers: { name: acme-config-admin }
    attrs: { name: acme-config-admin }

  - model: authentik_core.group
    id: group-key-rotation
    identifiers: { name: acme-key-rotation }
    attrs: { name: acme-key-rotation }

  - model: authentik_core.group
    id: group-read-only
    identifiers: { name: acme-read-only }
    attrs: { name: acme-read-only }

  # --- the two people you sign in as ------------------------------------------
  #
  # admin@example.com holds acme-admin, which is now exactly one thing: the key
  # to the STAFF console. It no longer confers any role in the customer console —
  # what it can do there depends on which accounts it is a member of.
  #
  # user@example.com holds acme-read-only, which grants nothing at all any more.
  # It is kept as the second person: a surface that looks right for the account
  # owner and wrong for everybody else is the failure this account exists to
  # catch, and having two people is what makes that visible.
  #
  # Everything here uses the password `devpass`.

  # admin@example.com is ALSO an authentik administrator, through the built-in
  # `authentik Admins` group — the one authentik ships with is_superuser set.
  #
  # Without it, administering the identity provider means signing in as the
  # bootstrap account from development/.env: a second identity, a second password
  # to have open, and the one credential in the stack that is not `devpass`. The
  # practical effect was that nobody used it, and blueprint changes got verified
  # through `ak shell` instead of through the interface a real operator would use
  # — which is how a flow can be correct in the database and unreachable in the UI
  # without anybody noticing.
  #
  # THIS IS A DEVELOPMENT CONVENIENCE AND MUST NOT BE COPIED FORWARD.
  # `public-edition` task 5.6 requires provider administration to be a small group
  # with mandatory multi-factor authentication; a test account whose password is
  # committed to this repository is the opposite of that. The production instance
  # is stood up from this blueprint (task 6.1), so this is exactly the entry
  # somebody has to remember to drop — hence the shouting.
  - model: authentik_core.user
    identifiers: { username: admin@example.com }
    attrs:
      username: admin@example.com
      name: Admin Example
      email: admin@example.com
      password: devpass
      is_active: true
      path: users
      groups:
        - !KeyOf group-admin
        - !Find [authentik_core.group, [name, authentik Admins]]

  - model: authentik_core.user
    identifiers: { username: user@example.com }
    attrs:
      username: user@example.com
      name: User Example
      email: user@example.com
      password: devpass
      is_active: true
      path: users
      groups:
        - !KeyOf group-read-only

  # --- the four the acceptance suite signs in as ------------------------------
  #
  # These are NOT redundant with the pair above, and deleting them breaks a test
  # rather than tidying a fixture. backend/acceptance/identity_test.go signs in as
  # each of the four by name and asserts it resolves to exactly one role, which is
  # the only end-to-end proof that the group claim still maps the way the service
  # expects. The key-rotation account is the load-bearing one: a user refused one
  # write and allowed a different one is what proves permissions are per action
  # rather than per "may write at all".
  #
  # They keep their bare usernames because the suite has them as literals.

  - model: authentik_core.user
    identifiers: { username: admin-user }
    attrs:
      username: admin-user
      name: Admin Dev
      email: admin-user@acmeservice.internal
      password: devpass
      is_active: true
      path: users
      groups:
        - !KeyOf group-admin

  - model: authentik_core.user
    identifiers: { username: config-admin-user }
    attrs:
      username: config-admin-user
      name: Config Admin Dev
      email: config-admin-user@acmeservice.internal
      password: devpass
      is_active: true
      path: users
      groups:
        - !KeyOf group-config-admin

  - model: authentik_core.user
    identifiers: { username: key-rotation-user }
    attrs:
      username: key-rotation-user
      name: Key Rotation Dev
      email: key-rotation-user@acmeservice.internal
      password: devpass
      is_active: true
      path: users
      groups:
        - !KeyOf group-key-rotation

  - model: authentik_core.user
    identifiers: { username: read-only-user }
    attrs:
      username: read-only-user
      name: Read Only Dev
      email: read-only-user@acmeservice.internal
      password: devpass
      is_active: true
      path: users
      groups:
        - !KeyOf group-read-only

  # --- the front door ---------------------------------------------------------
  #
  # THE PRODUCT USED TO BE CLOSED BY OMISSION, NOT BY DECISION.
  #
  # Until this flow existed, this file defined exactly one flow —
  # default-authentication-flow — and bound no enrolment flow to it. A person who
  # reached the sign-in page saw a username field, a password field and no way to
  # become somebody who had either. The door was not locked; there was no door.
  # Two other changes describe a switch that closed it. There was no switch
  # (self-service-signup design S1).
  #
  # WHAT THIS FLOW DOES, IN ORDER.
  #
  #   10  ask for a username, a name, an address and a password
  #   20  create the user — INACTIVE, on the path users/pending-verification
  #   30  send a confirmation link and wait for it to be clicked
  #   40  tell them the registration is with a person, and carry the new path
  #   50  move them to users/pending-approval
  #
  # TWO QUESTIONS ARE BEING ASKED AND THEY ARE NOT THE SAME QUESTION (design S2).
  # Verification asks "is this address yours" — a machine decides, in seconds,
  # permanently. Approval asks "do we want you as a customer" — a person decides,
  # in hours, and we intend to stop asking once the volume is trusted. They are
  # constantly conflated. Verification runs FIRST so that the queue a human reads
  # contains only addresses that exist: the reviewer's attention is the scarce
  # resource the whole gate depends on, and a queue full of typos and throwaway
  # addresses is a queue nobody reads carefully.
  #
  # THE TWO PATHS ARE THE QUEUE, and that is why the flow writes the user twice.
  # authentik's email stage needs a saved user to hang its token on, so the user
  # row necessarily exists BEFORE the address is proved. Without the second write
  # a reviewer could not tell somebody who confirmed their address from somebody
  # who typed it wrong and never came back — and approving the second kind is
  # exactly what the ordering above was for. So:
  #
  #   users/pending-verification  registered, never clicked the link
  #   users/pending-approval      address proved, waiting for a person
  #
  # The reviewer's queue is the second folder. authentik's user list renders paths
  # as a tree, so this is a queue without anybody building one (design S9).
  #
  # THE GATE ITSELF IS `create_users_as_inactive` ON STAGE 20, AND NOTHING ELSE.
  # It is here rather than in our service on purpose (design S3): held inactive at
  # the provider, an unapproved person never reaches us at all — no session, no
  # accounts row, no slug, no audit entry. If approval lived in our service, then
  # anybody able to fill in this form could make us write rows for a person we had
  # explicitly not decided to admit. Every row in `accounts` belongs to somebody
  # we admitted, by construction rather than by a predicate somebody has to
  # remember to consult (design S5).
  #
  # APPROVING SOMEBODY IS TICKING `Active` ON THEIR USER. Refusing them is leaving
  # it alone, or deleting the user. There is nothing to build for either.
  #
  # TURNING THE GATE OFF IS AN ACTION, NOT ONLY A SETTING (design S8). Clearing
  # `create_users_as_inactive` stops the flow creating inactive users. It does NOT
  # activate the ones it already created. That asymmetry is right in one direction
  # — tightening it must never lock out customers already working — and a trap in
  # the other, so switching it off is accompanied by activating whoever is still
  # held in users/pending-approval, as a step somebody takes and the event log
  # records. See development/authentik/README.md.
  #
  # AN INVITED PERSON WALKS THIS FLOW TOO, and waits like everybody else. There is
  # deliberately no second enrolment flow: the earlier design had one differing by
  # a single `user_write` key, and it was the whole mechanism of an exemption
  # anybody could reach merely by being invited (design S7, reversed;
  # account-invitations V13). What an invited person skips is the confirmation
  # mail — the invitation link already proved control of the address — and only
  # that. Confirmed is not admitted.

  - model: authentik_flows.flow
    id: flow-enrollment
    identifiers: { slug: acmeservice-enrollment }
    attrs:
      name: acmeservice-enrollment
      title: Create your AcmeAlias account
      designation: enrollment
      # An already-authenticated person has no business here, and without this
      # they would be offered a form that creates a second user for them.
      authentication: require_unauthenticated

  - model: authentik_stages_prompt.prompt
    id: enrollment-field-username
    identifiers: { name: acmeservice-enrollment-field-username }
    attrs:
      field_key: username
      label: Username
      type: username
      required: true
      placeholder: Username
      placeholder_expression: false
      order: 0

  - model: authentik_stages_prompt.prompt
    id: enrollment-field-name
    identifiers: { name: acmeservice-enrollment-field-name }
    attrs:
      field_key: name
      label: Name
      type: text
      required: true
      placeholder: Name
      placeholder_expression: false
      order: 1

  - model: authentik_stages_prompt.prompt
    id: enrollment-field-email
    identifiers: { name: acmeservice-enrollment-field-email }
    attrs:
      field_key: email
      label: Email
      type: email
      required: true
      placeholder: Email
      placeholder_expression: false
      order: 2

  - model: authentik_stages_prompt.prompt
    id: enrollment-field-password
    identifiers: { name: acmeservice-enrollment-field-password }
    attrs:
      field_key: password
      label: Password
      type: password
      required: true
      placeholder: Password
      placeholder_expression: false
      order: 3

  - model: authentik_stages_prompt.prompt
    id: enrollment-field-password-repeat
    identifiers: { name: acmeservice-enrollment-field-password-repeat }
    attrs:
      field_key: password_repeat
      label: Password (repeat)
      type: password
      required: true
      placeholder: Password (repeat)
      placeholder_expression: false
      order: 4

  # The sentence somebody reads at the end of enrolment, and the only thing they
  # are told before a person looks at them.
  #
  # TWELVE HOURS IS NOT A NEW NUMBER. staff-plane publishes a twelve-hour
  # best-effort commitment for its abuse contact, and this reuses it rather than
  # inventing a second one somebody would have to keep in step (design S2's open
  # question). It is load-bearing rather than polite: an invitation expires
  # fourteen days after it is ISSUED and that clock runs while its invitee waits
  # for us, so any promised response longer than fourteen days is a promise to
  # break invitations (design S7, account-invitations V13). The number is the
  # human's to confirm; what must not happen is a promise nobody keeps, because
  # the person waiting has been told a decision is coming.
  - model: authentik_stages_prompt.prompt
    id: enrollment-field-review-notice
    identifiers: { name: acmeservice-enrollment-field-review-notice }
    attrs:
      field_key: review_notice
      label: Registration received
      type: static
      required: false
      initial_value: >-
        Thank you — your address is confirmed. A person reviews every new
        registration before it can sign in, and we aim to do that within twelve
        hours. You will not be able to sign in until then.
      initial_value_expression: false
      placeholder: >-
        Thank you — your address is confirmed. A person reviews every new
        registration before it can sign in, and we aim to do that within twelve
        hours. You will not be able to sign in until then.
      placeholder_expression: false
      sub_text: You can close this page. There is nothing else for you to do.
      order: 0

  # A HIDDEN FIELD IS NOT A CLIENT-SUPPLIED ONE, which is what makes this safe.
  # authentik's prompt stage re-imposes the server's value on every hidden and
  # static field when the form comes back (`_validate_password_fields`' sibling
  # in stages/prompt/stage.py), so the browser cannot post a different path and
  # promote itself out of the queue. `path` is an ordinary field on the user, so
  # the user_write stage below writes it like any other.
  - model: authentik_stages_prompt.prompt
    id: enrollment-field-approved-path
    identifiers: { name: acmeservice-enrollment-field-approval-path }
    attrs:
      field_key: path
      label: path
      type: hidden
      required: false
      placeholder: users/pending-approval
      placeholder_expression: false
      order: 1

  - model: authentik_stages_prompt.promptstage
    id: enrollment-stage-details
    identifiers: { name: acmeservice-enrollment-details }
    attrs:
      name: acmeservice-enrollment-details
      fields:
        - !KeyOf enrollment-field-username
        - !KeyOf enrollment-field-name
        - !KeyOf enrollment-field-email
        - !KeyOf enrollment-field-password
        - !KeyOf enrollment-field-password-repeat

  - model: authentik_stages_prompt.promptstage
    id: enrollment-stage-review-notice
    identifiers: { name: acmeservice-enrollment-review-notice }
    attrs:
      name: acmeservice-enrollment-review-notice
      fields:
        - !KeyOf enrollment-field-review-notice
        - !KeyOf enrollment-field-approved-path

  # THE GATE. One key, and the whole of the approval mechanism.
  #
  # No group is set, and that is deliberate rather than an omission: nothing in
  # this product is derived from groups any more (personal-and-team-accounts C10),
  # and an enrolment flow that placed people in one would be the obvious place for
  # that to quietly start again.
  - model: authentik_stages_user_write.userwritestage
    id: enrollment-stage-user-write
    identifiers: { name: acmeservice-enrollment-user-write }
    attrs:
      name: acmeservice-enrollment-user-write
      create_users_as_inactive: true
      user_creation_mode: always_create
      user_path_template: users/pending-verification

  # The second write. It creates nothing — it exists to move a person from
  # users/pending-verification to users/pending-approval once, and only once, the
  # link in their mail has actually been clicked.
  # `create_users_as_inactive: false` — the gate moves OFF `is_active` here, and
  # this is the line that does it. Measured, not reasoned about:
  #
  #   is_active FALSE   Django's ModelBackend refuses inside the identification
  #                     stage (which carries `password_stage`, and must, because
  #                     that is what closes the enumeration oracle). Nothing
  #                     after it ever runs, so the person is told "Failed to
  #                     authenticate." — byte-identical to a wrong password, and
  #                     no later stage or policy can change that.
  #
  #   is_active TRUE    identification and the password succeed, and the deny
  #   + path            stage bound after them fires with a sentence that says
  #                     what is actually happening. Verified against this stack:
  #                     a wrong password and an unknown identifier still return
  #                     identical bodies, so the oracle stays shut.
  #
  # THE COST, because it is real and belongs next to the setting: `is_active` was
  # a flag Django enforces on every authentication path there is. The path is a
  # policy that guards the flows it is bound to and nothing else. So ANY flow
  # that ends in a user_login stage must carry the same deny — a recovery flow is
  # the one that will be added next and the one that would let an unapproved
  # person in through "forgot password".
  - model: authentik_stages_user_write.userwritestage
    id: enrollment-stage-user-write-verified
    identifiers: { name: acmeservice-enrollment-user-write-verified }
    attrs:
      name: acmeservice-enrollment-user-write-verified
      create_users_as_inactive: false
      user_creation_mode: never_create

  # `activate_user_on_success` IS DELIBERATELY FALSE, AND THE SHIPPED EXAMPLE
  # SETS IT TRUE. authentik's example enrolment flow uses `is_active` to mean
  # "has confirmed their address", so clicking the link activates the account.
  # Here `is_active` means "we have admitted this person", which is a different
  # and later fact — so confirming the address must not activate anybody, or the
  # approval gate is opened by the very mail that was only meant to prove an
  # address exists.
  - model: authentik_stages_email.emailstage
    id: enrollment-stage-email-verification
    identifiers: { name: acmeservice-enrollment-email-verification }
    attrs:
      name: acmeservice-enrollment-email-verification
      use_global_settings: true
      template: email/account_confirmation.html
      activate_user_on_success: false
      # THE SUBJECT IS OVERRIDDEN BECAUSE THE PROVIDER'S DEFAULT IS THE NAME OF
      # THE WRONG PRODUCT. authentik's email stage defaults its subject to
      # "authentik", which is correct and useless: the recipient came to us, and
      # the identity provider being a separate piece of software is our business
      # rather than theirs.
      #
      # The wording follows transactional-email T4's grammar rather than being
      # chosen freshly — the noun the message concerns comes FIRST, and there is
      # no constant prefix. It reads the way `Invitation to <account>` does, and
      # for the same reason: front-loading the noun is what makes a mailbox
      # search and a phone notification useful, and the prefix habit spends the
      # most valuable characters in an inbox on what the sender column already
      # shows (task 4.3 there).
      subject: Address confirmation

  - model: authentik_flows.flowstagebinding
    identifiers:
      target: !KeyOf flow-enrollment
      stage: !KeyOf enrollment-stage-details
      order: 10

  - model: authentik_flows.flowstagebinding
    identifiers:
      target: !KeyOf flow-enrollment
      stage: !KeyOf enrollment-stage-user-write
      order: 20

  - model: authentik_flows.flowstagebinding
    identifiers:
      target: !KeyOf flow-enrollment
      stage: !KeyOf enrollment-stage-email-verification
      order: 30

  - model: authentik_flows.flowstagebinding
    identifiers:
      target: !KeyOf flow-enrollment
      stage: !KeyOf enrollment-stage-review-notice
      order: 40

  - model: authentik_flows.flowstagebinding
    identifiers:
      target: !KeyOf flow-enrollment
      stage: !KeyOf enrollment-stage-user-write-verified
      order: 50

  # THERE IS NO user_login STAGE HERE, and its absence is the design.
  #
  # authentik's example enrolment flow ends by signing the new person in. This one
  # ends by telling them to wait. A user_login stage at the end would sign in an
  # account that was created inactive, which is the one thing the whole flow is
  # arranged to prevent.

  # --- bounding the mail this flow will send for anybody who asks --------------
  #
  # ONE SURFACE IS GENUINELY NEW HERE and it is not the general abuse question.
  # Most of that is answered elsewhere and does not reopen: five projects on a
  # personal account, per-domain billing on a team one, and a domain that answers
  # no challenge until its delegation has been seen — none of which an unapproved
  # person reaches. What IS new is that an unauthenticated stranger can now cause
  # us to send mail to an arbitrary address, which is a spam vector pointed at
  # third parties (design S10).
  #
  # authentik's reputation policy is the stock bound. It scores by client address
  # and by the identifier typed, dropping a point per failed identification or
  # failed login and rising on success, and it PASSES when the score is BAD —
  # which is why it is bound to a deny stage rather than to the flow. Below the
  # threshold, enrolment and sign-in both stop.
  #
  # Worth knowing before trusting it: nothing lowers a score for a SUCCESSFUL
  # enrolment, so this bounds an address that has been failing to sign in, not
  # somebody quietly registering a hundred throwaway accounts from one host. The
  # rate limit for that is public-edition's to add in production, where it also
  # configures this policy's real thresholds.
  - model: authentik_policies_reputation.reputationpolicy
    id: policy-reputation
    identifiers: { name: acmeservice-reputation }
    attrs:
      name: acmeservice-reputation
      check_ip: true
      check_username: true
      threshold: -5

  - model: authentik_stages_deny.denystage
    id: stage-deny-reputation
    identifiers: { name: acmeservice-reputation-deny }
    attrs:
      name: acmeservice-reputation-deny
      deny_message: >-
        Too many attempts from here. Wait a while and try again.

  # `evaluate_on_plan: false` with `re_evaluate_policies: true` is the pair that
  # makes a conditional stage work at all: evaluated when the flow is PLANNED the
  # reputation of the person is not yet known, because they have not typed
  # anything. Evaluated when the stage is REACHED, it is.
  - model: authentik_flows.flowstagebinding
    id: binding-enrollment-reputation
    identifiers:
      target: !KeyOf flow-enrollment
      stage: !KeyOf stage-deny-reputation
      order: 5
    attrs:
      evaluate_on_plan: false
      re_evaluate_policies: true

  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf binding-enrollment-reputation
      policy: !KeyOf policy-reputation
      order: 0

  - model: authentik_flows.flowstagebinding
    id: binding-authentication-reputation
    identifiers:
      target: !Find [authentik_flows.flow, [slug, default-authentication-flow]]
      stage: !KeyOf stage-deny-reputation
      order: 15
    attrs:
      evaluate_on_plan: false
      re_evaluate_policies: true

  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf binding-authentication-reputation
      policy: !KeyOf policy-reputation
      order: 0

  # --- one page, and no username oracle ---------------------------------------
  #
  # authentik ships an identification stage that asks for the identifier, submits
  # it, and THEN asks for a password. That two-step is an enumeration oracle: the
  # response to step one differs depending on whether the account exists, so
  # anyone can test an address list against this login page and learn which of
  # them are customers. `show_matched_user` makes it worse by displaying the
  # account it matched.
  #
  # Setting `password_stage` renders the password field on the SAME page as the
  # identifier. The pair is then submitted together and a wrong identifier and a
  # wrong password fail identically — which is the property that closes the
  # oracle, not merely the aesthetics of one page instead of two.
  #
  # This modifies a stage authentik ships rather than adding one, so it stays in
  # step with the default flow instead of forking it. Both identifier forms stay
  # accepted: the addresses here are usernames AND emails, and a person who typed
  # the one they remember should not be told they picked the wrong field.
  #
  # `enrollment_flow` IS THE SIGN UP LINK. There is no separate setting for it and
  # no template to edit: the identification stage renders the link if and only if
  # it names a flow here, which is why the absence of this one line WAS the whole
  # of the product's closure (design S1).
  #
  # AN UNAPPROVED PERSON STILL MEETS "Failed to authenticate.", AND THAT IS A
  # KNOWN DEFECT, NOT AN OVERSIGHT. Design S3 requires a real message here rather
  # than a refusal indistinguishable from a wrong password, and authentik 2024.10
  # cannot give one while `is_active` is the gate. Verified by hand against this
  # stack: an unknown identifier, a wrong password and a correct password for an
  # INACTIVE user all return exactly `{"non_field_errors": [{"string": "Failed to
  # authenticate.", "code": "invalid"}]}`. The reason is structural — because
  # `password_stage` is set, the password is checked INSIDE this stage's
  # validation, and Django's ModelBackend refuses an inactive user there, so no
  # later stage or policy in the flow is ever reached and there is nothing for a
  # deny stage to fire on.
  #
  # The obvious repair makes it worse: dropping `password_stage` puts the deny
  # stage before any password is proved, so anybody could type an address and be
  # told whether it has a registration awaiting review. That is the enumeration
  # oracle the line below exists to close. See self-service-signup task 2.2.
  - model: authentik_stages_identification.identificationstage
    identifiers: { name: default-authentication-identification }
    attrs:
      user_fields: [email, username]
      password_stage:
        !Find [authentik_stages_password.passwordstage, [name, default-authentication-password]]
      show_matched_user: false
      enrollment_flow: !KeyOf flow-enrollment

  # --- the group claim --------------------------------------------------------
  #
  # The claim is still emitted, and it no longer decides anything (design C10).
  #
  # It used to be the whole of the permission model: the `groups` claim compared
  # against one setting per role, at every request. Now it is recorded — on the
  # session, and beside the roles in every audit entry — because what the identity
  # provider said about a person is worth keeping even when nothing is concluded
  # from it. That makes the shape of the list a diagnostic question rather than an
  # access one, which is a real demotion: a wrong shape here used to lock people
  # out and now only makes an audit entry read oddly.
  #
  # The shape is still bare names (`acme-admin`), not paths (`/acme-admin`), and
  # ACME_OIDC_GROUP_PREFIX still exists to absorb providers that disagree. The
  # decision is unchanged: emit the right shape here and leave that setting empty,
  # so development exercises the same code path production will.

  - model: authentik_providers_oauth2.scopemapping
    id: mapping-groups
    identifiers: { name: acmeservice-groups }
    attrs:
      name: acmeservice-groups
      scope_name: groups
      description: "The group names this user belongs to, unqualified."
      expression: |
        return [group.name for group in request.user.ak_groups.all()]

  # --- the customer console ---------------------------------------------------
  #
  # Client id and secret match development/.env. The secret is committed to the
  # repository, which is correct for a stack that only ever runs on a developer's
  # machine and is said out loud here so nobody mistakes it for an accident.
  #
  # The redirect URL must be exactly what the service asks for. It is the one URL
  # in this file that, if wrong, fails at the very last hop of sign-in with an
  # error from authentik rather than from us.

  - model: authentik_providers_oauth2.oauth2provider
    id: provider-console
    identifiers: { name: acmeservice-console }
    attrs:
      name: acmeservice-console
      client_type: confidential
      client_id: acmeservice-console
      client_secret: dev-console-secret
      sub_mode: hashed_user_id
      include_claims_in_id_token: true
      # WITHOUT THIS THE ID TOKEN IS SIGNED HS256 AND SIGN-IN FAILS WITH A 500.
      #
      # An authentik OAuth2 provider with no signing key falls back to signing the
      # identity token symmetrically with the client secret. go-oidc, which this
      # service verifies with, accepts RS256 only — so the callback fails with
      # `malformed jwt: unexpected signature algorithm "HS256"`, which arrives as
      # a 500 AFTER a completely successful login and reads like our bug.
      #
      # Asymmetric is also the right answer independently: an HS256 token is
      # verifiable by anyone holding the client secret, so every party that can
      # READ a token could also mint one.
      signing_key:
        !Find [authentik_crypto.certificatekeypair, [name, "authentik Self-signed Certificate"]]
      redirect_uris:
        - url: http://console.localhost/api/v1/auth/callback
          matching_mode: strict
        # Sign-out sends the browser here through authentik's end-session
        # endpoint (ACME_POST_LOGOUT_REDIRECT_URL). authentik validates a
        # post_logout_redirect_uri against THIS list — the same one the callback
        # is registered in — and refuses an unregistered one, so ending the
        # provider's session needs the marketing site named here as well.
        - url: http://www.localhost
          matching_mode: strict
      authorization_flow:
        !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow:
        !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, email]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, profile]]
        - !KeyOf mapping-groups

  # The application is what a person sees and what access binds to; the provider
  # above is the protocol machinery behind it. The slug is load-bearing: it is the
  # `acmeservice-console` in
  # http://auth.localhost/application/o/acmeservice-console/ that ACME_OIDC_ISSUER
  # is set to, and the issuer is validated on every token.
  - model: authentik_core.application
    identifiers: { slug: acmeservice-console }
    attrs:
      name: acmeservice
      slug: acmeservice-console
      provider: !KeyOf provider-console
      meta_description: "Certificate challenge handling for domains whose DNS you keep where it is."

  # --- the staff console ------------------------------------------------------
  #
  # A second application, not a second role inside the first. Its callback is on
  # admin.localhost, so the session cookie it sets belongs to the staff origin and
  # to nothing else.

  - model: authentik_providers_oauth2.oauth2provider
    id: provider-admin
    identifiers: { name: acmeservice-admin }
    attrs:
      name: acmeservice-admin
      client_type: confidential
      client_id: acmeservice-admin
      client_secret: dev-admin-secret
      sub_mode: hashed_user_id
      include_claims_in_id_token: true
      # WITHOUT THIS THE ID TOKEN IS SIGNED HS256 AND SIGN-IN FAILS WITH A 500.
      #
      # An authentik OAuth2 provider with no signing key falls back to signing the
      # identity token symmetrically with the client secret. go-oidc, which this
      # service verifies with, accepts RS256 only — so the callback fails with
      # `malformed jwt: unexpected signature algorithm "HS256"`, which arrives as
      # a 500 AFTER a completely successful login and reads like our bug.
      #
      # Asymmetric is also the right answer independently: an HS256 token is
      # verifiable by anyone holding the client secret, so every party that can
      # READ a token could also mint one.
      signing_key:
        !Find [authentik_crypto.certificatekeypair, [name, "authentik Self-signed Certificate"]]
      redirect_uris:
        - url: http://admin.localhost/api/admin/auth/callback
          matching_mode: strict
        # Sign-out sends the browser here through authentik's end-session
        # endpoint (ACME_POST_LOGOUT_REDIRECT_URL). authentik validates a
        # post_logout_redirect_uri against THIS list — the same one the callback
        # is registered in — and refuses an unregistered one, so ending the
        # provider's session needs the marketing site named here as well.
        - url: http://www.localhost
          matching_mode: strict
      authorization_flow:
        !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow:
        !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, email]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, profile]]
        - !KeyOf mapping-groups

  # Group-restricted, which the customer application deliberately is not: staff
  # access is a small list, and the production design (U12) says the staff
  # application admits a staff group and nothing else. Here that group is
  # acme-admin, so user@example.com can reach the customer console and is refused
  # by the staff one — which is the arrangement worth being able to demonstrate.
  #
  # This is the ONE thing acme-admin still does. It is unrelated to the role
  # mapping design C10 removed, and the two are easy to conflate: deleting the
  # group as part of that removal would close the staff console.
  - model: authentik_core.application
    identifiers: { slug: acmeservice-admin }
    attrs:
      name: acmeservice staff
      slug: acmeservice-admin
      provider: !KeyOf provider-admin
      meta_description: "Staff surface. Address-restricted at the ingress; see public-edition U7."

  # --- what the sign-in page looks like ---------------------------------------
  #
  # A BRAND, in authentik's sense, is the per-domain appearance and set of default
  # flows — the object that decides which logo, title and favicon a person sees.
  # Every installation has exactly one to begin with, whose domain is the literal
  # string `authentik-default` and which matches when no other brand's domain does.
  # This modifies that one rather than adding a second, because a second brand
  # would only ever be selected on a hostname this stack does not have.
  #
  # The two image paths are files bind-mounted into the image by
  # development/compose.yaml; /static/dist is how the server publishes /web/dist.
  # They are NOT uploads: an uploaded logo would live in ./data/authentik_media
  # and disappear on the next `reset.sh`, leaving a blueprint that names a file
  # nobody can serve.
  #
  # The black background and the accent green are not here — 2024.10's brand has
  # no CSS field at all — they are development/authentik/branding/custom.css.
  - model: authentik_brands.brand
    identifiers: { domain: authentik-default }
    attrs:
      branding_title: AcmeAlias
      branding_logo: /static/dist/brand/logo.png
      branding_favicon: /static/dist/brand/logo.png
      # authentik ships both a light and a dark stylesheet and picks per browser
      # preference by default. Pinned to dark here, so the page every visitor
      # gets is the one the CSS below is written against — a light-theme visitor
      # would otherwise land on white PatternFly components sitting on our black
      # background, which is worse than either theme on its own.
      attributes:
        settings:
          theme:
            base: dark

  # The line above the username field. authentik ships "Welcome to authentik!",
  # which is the correct name of the wrong product as far as anyone signing in is
  # concerned: they came to us, and the identity provider being a separate piece
  # of software is our business rather than theirs.
  # --- the sentence an unapproved person actually reads --------------------------
  #
  # A DenyStage bound AFTER the password, so it can say something specific without
  # telling a stranger whether an address is registered. The ordering is the whole
  # trick: everything before order 20 runs on an identifier alone, and anything
  # that refuses there is an oracle.
  - model: authentik_policies_expression.expressionpolicy
    identifiers: { name: acmeservice-is-pending-approval }
    attrs:
      name: acmeservice-is-pending-approval
      expression: |
        return request.user.path.startswith("users/pending-approval")

  - model: authentik_stages_deny.denystage
    identifiers: { name: acmeservice-pending-approval-deny }
    attrs:
      name: acmeservice-pending-approval-deny
      # Says what is happening, what happens next, and asks for nothing. A person
      # who has just proved they know the password and is still refused needs to
      # know it is not them.
      deny_message: >-
        Your registration is still being reviewed. We will email you as soon as
        it is approved.

  # Order 25: after the password stage (20) and before MFA (30). Bound to the
  # AUTHENTICATION flow, not the enrolment one — enrolment ends without a session
  # and has nothing to deny.
  - model: authentik_flows.flowstagebinding
    id: binding-pending-approval-deny
    identifiers:
      target: !Find [authentik_flows.flow, [slug, default-authentication-flow]]
      stage: !Find [authentik_stages_deny.denystage, [name, acmeservice-pending-approval-deny]]
      order: 25

  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf binding-pending-approval-deny
      policy: !Find [authentik_policies_expression.expressionpolicy, [name, acmeservice-is-pending-approval]]
      order: 0

  - model: authentik_flows.flow
    identifiers: { slug: default-authentication-flow }
    attrs:
      title: Welcome to AcmeAlias
