---
# CI for acmeservice. See openspec/changes/add-acme-alias-service/design.md
# D9 (three listeners, CAP_NET_BIND_SERVICE, embedded console), D13 (test
# split) and D15 (Docker Compose production deploy) for the reasoning below.

stages:
  - lint
  - test
  - build
  - publish

variables:
  GOPATH: "$CI_PROJECT_DIR/.cache/go"
  GOMODCACHE: "$CI_PROJECT_DIR/.cache/go-mod"

.go-cache:
  cache:
    key:
      files: [backend/go.sum]
    paths:
      - .cache/go
      - .cache/go-mod

lint-go:
  stage: lint
  # golangci-lint isn't installed on developer machines or generic runner
  # images — this image provides the binary instead of us installing it.
  image: golangci/golangci-lint:latest-alpine
  extends: .go-cache
  script:
    - cd backend && golangci-lint run ./...

lint-frontend:
  stage: lint
  image: node:22-bookworm-slim
  cache:
    key:
      files: [frontend/package-lock.json]
    paths:
      - frontend/node_modules
  script:
    - cd frontend && npm ci && npx ng lint

test-go:
  stage: test
  image: golang:1.26.3-bookworm
  extends: .go-cache
  # Deliberately no TEST_DATABASE_URL here: the integration and
  # schema-drift tests `t.Skip` when it's unset, which is on purpose in CI
  # (design D13). They're a dev-stack activity, exercised locally against
  # development/scripts/up.sh's PostgreSQL via scripts/test-integration.sh.
  # Do NOT set TEST_DATABASE_URL to "fix" that — see D13 before changing this.
  script:
    - cd backend && go test -race ./...

test-frontend:
  stage: test
  image: node:22-bookworm-slim
  cache:
    key:
      files: [frontend/package-lock.json]
    paths:
      - frontend/node_modules
  before_script:
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends chromium
    # CI jobs run as root, and Chrome refuses to run its sandbox as root
    # (crbug.com/638180). karma-chrome-launcher's built-in ChromeHeadless
    # launcher doesn't add --no-sandbox and there's no karma.conf.js in
    # frontend/ to add a custom launcher to, so point CHROME_BIN at a
    # thin wrapper that always adds it instead.
    - printf '#!/bin/sh\nexec /usr/bin/chromium --no-sandbox "$@"\n' > /usr/local/bin/chromium-ci
    - chmod +x /usr/local/bin/chromium-ci
    - export CHROME_BIN=/usr/local/bin/chromium-ci
  script:
    - cd frontend && npm ci
    - npx ng test --watch=false --browsers=ChromeHeadless

build:
  stage: build
  image: docker:27-cli
  # The runners have the Docker socket mounted (design D13/D15), so a plain
  # `docker build` works here without docker:dind.
  script:
    - docker build -t "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA" .

# NO ACCEPTANCE STAGE HERE, AND THAT IS A DECISION — see design A10 of
# openspec/changes/add-acceptance-environment. The acceptance suite exists and
# is runnable: ./scripts/test-acceptance.sh drives the development stack
# through a real DNS-01 issuance and asserts the trust chain, the wildcard
# invariant, the authorization boundaries, cleanup, durability, the DNS plan
# and sign-in. It is a LOCAL gate on purpose.
#
# The reason is cost against a signal nobody is currently asking merges to wait
# on: the job needs a Docker daemon, a Dockerfile.api build, an `npm ci` for the
# web container, a Keycloak boot and several real ACME exchanges — minutes on
# every pipeline. CI's job here is to lint, unit-test, build the image and push
# it on a tag, and that is all it does.
#
# So the absence of this stage is not an oversight and re-adding it is not a
# fix. If merges should one day block on end-to-end issuance, this is a
# one-block edit — the script the job would call is exactly the same one.

publish:
  stage: publish
  image: docker:27-cli
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - docker build -t "$CI_REGISTRY_IMAGE:$CI_COMMIT_TAG" -t "$CI_REGISTRY_IMAGE:latest" .
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
    - docker push "$CI_REGISTRY_IMAGE:$CI_COMMIT_TAG"
    - docker push "$CI_REGISTRY_IMAGE:latest"
