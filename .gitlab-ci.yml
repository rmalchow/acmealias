---
# CI for acmeservice. See openspec/changes/add-acme-alias-service/design.md
# D9 (three listeners, CAP_NET_BIND_SERVICE, embedded console), D13 (test
# split) and D15 (Docker Compose production deploy) for the reasoning below.

stages:
  - test
  - build
  - publish

variables:
  GOPATH: "$CI_PROJECT_DIR/.cache/go"
  GOMODCACHE: "$CI_PROJECT_DIR/.cache/go-mod"
  REGISTRY: harbor.rand0m.me/public
  DOCKER_BUILDKIT: "1"
  # Persistent BuildKit local-cache root, bind-mounted from the runner host.
  CACHE_DIR: /var/cache/acme-buildkit

.go-cache:
  cache:
    key:
      files: [backend/go.sum]
    paths:
      - .cache/go
      - .cache/go-mod

# WHAT CI DOES AND DOES NOT DO, because this pipeline is deliberately thin.
#
# It used to lint Go, lint the frontend, run `go test -race`, and run the Angular
# suite under headless Chromium. All four are run locally, all the time, and a
# second copy of them here bought a slower merge rather than a signal anybody was
# waiting on — which is the same argument design D13 already makes about the
# integration tests and A10 makes about the acceptance suite. The pipeline now
# follows that reasoning to its end instead of applying it to two stages out of
# four.
#
# WHAT STILL GUARDS A MERGE, and it is more than "nothing":
#
#   - `go test ./...` below. Seconds, no external dependency, and it is the one
#     thing a clean checkout can tell you that a working tree cannot — that the
#     tests pass against what is COMMITTED rather than against what is on disk.
#   - The image build. It compiles both Angular projects and the Go binary from
#     a clean context, so a broken template, a missing import or a `go:embed`
#     that no longer resolves fails the pipeline whether or not anybody ran
#     anything locally.
#
# What is genuinely gone is style enforcement and the frontend unit suite. If a
# lint regression ever lands on main and nobody notices, that is the cost being
# paid, and re-adding a job is a five-line edit.

test-go:
  stage: test
  image: golang:1.26.3-bookworm
  extends: .go-cache
  # EVERY BRANCH EXCEPT MAIN, which is the mirror image of the image jobs below.
  #
  # The suite takes about eight minutes on the one runner this project has, and
  # on main that time buys nothing anybody waits for: main is reached by pushing
  # a branch whose pipeline ALREADY RAN it, and what main is wanted for is the
  # image. Leaving it here meant every deploy sat eight minutes behind a rerun
  # of the run that let the code onto main in the first place — with both image
  # jobs queued behind it on the same runner.
  #
  # WHAT THIS COSTS, stated here rather than discovered later: main has no test
  # gate of its own. A commit that reaches main WITHOUT passing through a branch
  # pipeline — a fast-forward of unpushed work, a web-UI edit, a commit that
  # swept up somebody else's staged changes — is now tested by nothing. That is
  # not hypothetical; it happened once already today. The branch run is the only
  # gate left, so a red branch pipeline is a block on merging rather than a note.
  #
  # THE SAME `tags:` THE IMAGE JOBS GAINED, and for the same reason: the one
  # runner this project has declares the tag `shared` and `run_untagged=false`,
  # so an untagged job is never picked up. It does not fail — it sits pending
  # until GitLab gives up and marks it `stuck_pending_no_matching_runners`,
  # which is a red pipeline with an empty log, and the build jobs behind it are
  # then SKIPPED rather than run. Two pipelines died that way before anybody
  # read the failure reason rather than the failure.
  tags:
    - shared
  rules:
    - if: $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH
  # Deliberately no TEST_DATABASE_URL here: the integration and
  # schema-drift tests `t.Skip` when it's unset, which is on purpose in CI
  # (design D13). They're a dev-stack activity, exercised locally against
  # development/scripts/up.sh's PostgreSQL via scripts/test-integration.sh.
  # Do NOT set TEST_DATABASE_URL to "fix" that — see D13 before changing this.
  #
  # WITHOUT `-race`, which this job used to carry. The detector roughly triples
  # the run and its findings are the kind you get from exercising the thing, not
  # from a unit suite — `./scripts/test.sh` keeps it locally.
  script:
    - cd backend && go test ./...

# TWO IMAGES, not one, and they are separate because they change on completely
# different cadences. A price table on the marketing site is edited far more
# often than a DNS server, and one image would mean redeploying the thing that
# answers challenges in order to fix a typo.
#
#   acmealias   the service: one Go binary carrying BOTH Angular consoles
#               (internal/webui embeds all:dist and serves dist/console to
#               customers, dist/admin to staff), the DNS server and the
#               challenge API
#   acmesite    the marketing site: static files behind unprivileged nginx
#
# Both build from the REPOSITORY ROOT. The service image copies frontend/ and
# backend/, so it is not buildable from backend/ alone.

.build-image: &build-image
  stage: build
  image: docker:27-cli
  tags:
    - shared
  # BUILDS ARE MAIN-ONLY; TESTS RUN EVERYWHERE.
  #
  # The two stages answer different questions and deserve different triggers.
  # `go test` answers "is this commit sound", which is worth knowing on every
  # branch and every merge request, and costs seconds. The image build answers
  # "can this be deployed", which is only a question about the branch anything
  # is ever deployed from — and it costs an Angular build, a Go build and a
  # BuildKit context on a single shared runner, every time anybody pushes
  # anything.
  #
  # The concrete cost of not having this rule: a feature branch pushed four
  # times in an hour queued four full image builds behind each other on the one
  # runner, so the pipeline somebody was actually waiting on sat behind three
  # they were not.
  #
  # Tags still build, because the publish stage below is tag-only and needs the
  # layer cache the build stage warms.
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG
  # The runners have the Docker socket mounted (design D13/D15), so a plain
  # `docker buildx` works here without docker:dind.
  before_script:
    - mkdir -p ~/.docker
    - cp "${CONFIG_JSON}" ~/.docker/config.json
    - docker buildx create --name acme-builder --driver docker-container --bootstrap || true
    - docker buildx use acme-builder
  # PUSHED, NOT LOADED, and the difference is the whole point of this edit.
  #
  # `--load` puts the image in the LOCAL docker daemon of whichever machine ran
  # the job. That worked for as long as there was one runner and it happened to
  # be the production host: `docker compose up` found the image already there
  # and never pulled. It was never written down, and it stopped being true the
  # moment a second runner existed — a green build then left the artefact on the
  # wrong machine, invisible to the server that needed it, with no error
  # anywhere.
  #
  # So the build stage publishes. `latest` is what the production compose file
  # resolves ${IMAGE_TAG:-latest} to, and the SHA tag rides along beside it so a
  # deployment can be pinned to a commit and rolled back to one.
  #
  # THIS MAKES EVERY MAIN BUILD A PUBLISH, which the tag-only publish stage below
  # was written to avoid. That rule is not being overturned by accident: it drew
  # the line between "compiles" and "deployable", and the line has moved, because
  # main is now the only branch that builds at all. Nothing DEPLOYS on its own —
  # a server still has to pull and recreate — so what changes is where the
  # artefact lives, not who decides to run it.
  script: |
    IMAGE=$REGISTRY/$IMAGE_NAME
    CACHE=$CACHE_DIR/$IMAGE_NAME
    mkdir -p "$CACHE"
    docker buildx build \
      --cache-from type=local,src="$CACHE" \
      --cache-from type=registry,ref="$IMAGE:latest" \
      --cache-to   type=local,dest="$CACHE",mode=max \
      --build-arg  BUILDKIT_INLINE_CACHE=1 \
      -f "$DOCKERFILE" \
      -t "$IMAGE:$CI_COMMIT_SHA" \
      -t "$IMAGE:latest" \
      --push \
      .

build-acmealias:
  <<: *build-image
  variables:
    IMAGE_NAME: acmealias
    DOCKERFILE: Dockerfile

build-acmesite:
  <<: *build-image
  variables:
    IMAGE_NAME: acmesite
    DOCKERFILE: docker/Dockerfile.site

# NO ACCEPTANCE STAGE HERE, AND THAT IS A DECISION — see design A10 of
# openspec/changes/add-acceptance-environment. The acceptance suite exists and
# is runnable: ./scripts/test-acceptance.sh drives the development stack
# through a real DNS-01 issuance and asserts the trust chain, the wildcard
# invariant, the authorization boundaries, cleanup, durability, the DNS plan
# and sign-in. It is a LOCAL gate on purpose.
#
# The reason is cost against a signal nobody is currently asking merges to wait
# on: the job needs a Docker daemon, a Dockerfile.api build, an `npm ci` for the
# web container, a Keycloak boot and several real ACME exchanges — minutes on
# every pipeline. CI's job here is to lint, unit-test, build the image and push
# it on a tag, and that is all it does.
#
# So the absence of this stage is not an oversight and re-adding it is not a
# fix. If merges should one day block on end-to-end issuance, this is a
# one-block edit — the script the job would call is exactly the same one.

# PUBLISH IS TAG-ONLY, and now overlaps the build stage on purpose.
#
# It used to be the only thing that pushed anything; the build stage above now
# pushes `latest` and a SHA tag on every main build, because a build whose
# artefact exists only in one runner's local daemon is not an artefact. What
# this stage still does that the other does not is mint a NAMED, IMMUTABLE
# release: `$CI_COMMIT_TAG` is a human decision about a version, and it is the
# tag a rollback names when nobody remembers which commit was good.

.publish-image: &publish-image
  stage: publish
  image: docker:27-cli
  tags:
    - shared
  rules:
    - if: $CI_COMMIT_TAG
  before_script:
    - mkdir -p ~/.docker
    - cp "${CONFIG_JSON}" ~/.docker/config.json
    - docker buildx create --name acme-builder --driver docker-container --bootstrap || true
    - docker buildx use acme-builder
  script: |
    IMAGE=$REGISTRY/$IMAGE_NAME
    CACHE=$CACHE_DIR/$IMAGE_NAME
    mkdir -p "$CACHE"
    docker buildx build \
      --cache-from type=local,src="$CACHE" \
      --cache-from type=registry,ref="$IMAGE:latest" \
      --cache-to   type=local,dest="$CACHE",mode=max \
      --build-arg  BUILDKIT_INLINE_CACHE=1 \
      -f "$DOCKERFILE" \
      -t "$IMAGE:$CI_COMMIT_TAG" \
      -t "$IMAGE:latest" \
      --load \
      .
    docker push "$IMAGE:$CI_COMMIT_TAG"
    docker push "$IMAGE:latest"

publish-acmealias:
  <<: *publish-image
  variables:
    IMAGE_NAME: acmealias
    DOCKERFILE: Dockerfile

publish-acmesite:
  <<: *publish-image
  variables:
    IMAGE_NAME: acmesite
    DOCKERFILE: docker/Dockerfile.site
